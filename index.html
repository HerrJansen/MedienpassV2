<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Medienpass | Gymnasium Thomaeum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.32.2/js/msal-browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --thomaeum-red: #BF0D3E; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: var(--thomaeum-red); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const MS_CONFIG = {
            tenantId: "09c4bd58-1b8c-410d-930e-816015e61028",
            clientId: "7d277b19-93c1-4df7-8f1b-d38749b3d440",
            siteId: "thomaeumde.sharepoint.com,9ef17c4d-b57b-482e-9168-3cc3bc43bc3d,d600d53b-cfd0-45f7-96a5-f1ac20222f8f",
            listId: "08da02d9-5b67-4938-9d7e-9e9dee97fa2e"
        };

        const msalConfig = {
            auth: {
                clientId: MS_CONFIG.clientId,
                authority: `https://login.microsoftonline.com/${MS_CONFIG.tenantId}`,
                redirectUri: window.location.origin,
                navigateToLoginRequestUrl: true
            },
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
        };
        
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const msalInitPromise = msalInstance.initialize();

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    setSvg(window.lucide.icons[name].toSvg({ width: size, height: size, class: className }));
                }
            }, [name, size, className]);
            return <span className={`inline-flex items-center justify-center ${className}`} dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        const ALL_MODULES = [
            // Klasse 5-6
            { id: 1, title: "Word-Schulung und Dateimanagement", stage: "5-6", category: "skills", icon: "file-text" },
            { id: 3, title: "Power-Point-Schulung", stage: "5-6", category: "skills", icon: "presentation" },
            { id: 2, title: "Sicher im Netz", stage: "5-6", category: "reflexion", icon: "shield-check" },
            { id: 4, title: "Klassen-Kodex", stage: "5-6", category: "reflexion", icon: "users" },
            
            // Klasse 7-8
            { id: 5, title: "Digitale Kunst & Design", stage: "7-8", category: "skills", icon: "palette" },
            { id: 6, title: "Tabellenkalkulation & Datenanalyse", stage: "7-8", category: "skills", icon: "table" },
            { id: 7, title: "Geschichte 2.0", stage: "7-8", category: "reflexion", icon: "landmark" },
            { id: 8, title: "Digitale Identität", stage: "7-8", category: "reflexion", icon: "user-circle" },

            // Klasse 9-10
            { id: 9, title: "Audio-Studio", stage: "9-10", category: "skills", icon: "mic" },
            { id: 10, title: "KI im Alltag", stage: "9-10", category: "skills", icon: "cpu" },
            { id: 11, title: "Ethik der Algorithmen", stage: "9-10", category: "reflexion", icon: "scale" },
            { id: 12, title: "Der Gläserne Mensch", stage: "9-10", category: "reflexion", icon: "eye" },
            { id: 13, title: "Digitale Ökonomie", stage: "9-10", category: "reflexion", icon: "trending-up" }
        ];

        const MODULE_CONTENT_DATA = {
            1: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Dein PC ist wie ein Rucksack: Ohne Ordnung findest du nichts wieder.", blocks: [
                        { type: 'standard', title: 'Der Windows Explorer', text: 'Drücke `Win` + `E`, um deine Ordner zu sehen. Erstelle Ordner für jedes Fach über **Rechtsklick > Neu > Ordner**.' },
                        { type: 'tip', title: 'Word-Profi', text: 'Nutze für Überschriften die **Formatvorlagen**. So erkennt Word automatisch, was eine Überschrift ist.' },
                        { type: 'warning', title: 'Lebensretter', text: 'Drücke oft `Strg` + `S`. Wenn du etwas löschst, drücke `Strg` + `Z` zum Rückgängigmachen.' }
                    ]},
                    { title: "2. Kriterien für Qualität", intro: "Ein guter Dateiname rettet dir vor der Arbeit die Note.", blocks: [
                        { type: 'info', title: 'Namensregeln', text: 'Nenne Dateien sinnvoll: `Datum_Fach_Thema`. Vermeide Zeichen wie `? : * < >` im Namen.' },
                        { type: 'success', title: 'PDF Export', text: 'Speichere fertige Texte als **PDF**. So verschiebt sich nichts mehr.' }
                    ]}
                ],
                missions: ["Erstelle einen Ordner 'Schule' auf dem Desktop.", "Erstelle darin Unterordner für Deutsch und Mathe.", "Benenne eine Datei nach dem Muster '2026-Bio-Pflanze' um.", "Schreibe einen Satz in Word und mache ein Wort fett.", "Speichere ein Dokument testweise als PDF."]
            },
            3: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Präsentationen sind das digitale Plakat von heute.", blocks: [
                        { type: 'standard', title: 'Layout-Wahl', text: 'Wähle für neue Folien immer ein passendes Layout (z.B. "Titel und Inhalt"). So bleibt alles an seinem Platz.' },
                        { type: 'tip', title: 'Design-Ideen', text: 'Nutze den integrierten **Designer**, um deine Folien mit einem Klick professionell aussehen zu lassen.' }
                    ]},
                    { title: "2. Kriterien für Qualität", intro: "Das Publikum soll dir zuhören, nicht nur lesen.", blocks: [
                        { type: 'warning', title: 'Text-Limit', text: 'Schreibe niemals ganze Sätze auf Folien! Nutze Stichpunkte: Maximal 5 Punkte pro Folie.' },
                        { type: 'info', title: 'Bilder-Wirkung', text: 'Ein großes, scharfes Bild ist besser als fünf kleine. Ziehe Bilder immer nur an den Ecken groß.' }
                    ]}
                ],
                missions: ["Erstelle eine Titelfolie mit deinem Namen.", "Füge ein Bild ein und nutze den Designer.", "Schreibe 3 kurze Stichpunkte auf eine Folie.", "Starte den Präsentationsmodus mit F5.", "Übe das freie Sprechen zu einer Folie für 30 Sekunden."]
            },
            6: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Excel ist ein Taschenrechner für Riesen-Tabellen.", blocks: [
                        { type: 'standard', title: 'Formeln nutzen', text: 'Jede Rechnung in Excel beginnt mit einem `=`. Beispiel: `=A1+A2`.' },
                        { type: 'tip', title: 'Blitz-Summe', text: 'Markiere Zahlen und klicke auf das Summen-Symbol (Σ), um sie sofort zusammenzurechnen.' }
                    ]},
                    { title: "2. Kriterien für Qualität", intro: "Diagramme machen Daten sichtbar.", blocks: [
                        { type: 'info', title: 'Säule oder Kreis?', text: 'Nutze Säulendiagramme für Vergleiche und Kreisdiagramme für Anteile (Prozente).' },
                        { type: 'success', title: 'Beschriftung', text: 'Ein Diagramm braucht immer einen Titel und benannte Achsen.' }
                    ]}
                ],
                missions: ["Trage 5 Zahlen untereinander in Excel ein.", "Berechne die Summe dieser Zahlen mit einer Formel.", "Erstelle aus den Zahlen ein Säulendiagramm.", "Gib dem Diagramm einen Titel.", "Formatiere die Tabellenköpfe fett."]
            }
        };

        const RenderWissensspeicher = ({ module }) => {
            const data = MODULE_CONTENT_DATA[module.id];
            if (!data) return (
                <div className="text-center py-16 opacity-50">
                    <Icon name="book-open" size={48} className="mb-4" />
                    <h3 className="text-xl font-bold">Wissensspeicher folgt</h3>
                    <p className="text-sm">Inhalte werden aktuell eingepflegt.</p>
                </div>
            );

            const theme = {
                "5-6": { accent: "bg-green-500", border: "border-green-100", text: "text-green-900" },
                "7-8": { accent: "bg-blue-500", border: "border-blue-100", text: "text-blue-900" },
                "9-10": { accent: "bg-slate-700", border: "border-slate-200", text: "text-slate-900" }
            }[module.stage];

            return (
                <div className="space-y-10">
                    {data.sections.map((sec, i) => (
                        <div key={i}>
                            <h4 className="font-black text-lg text-slate-800 mb-4 flex items-center gap-2">
                                <span className={`w-8 h-8 rounded-lg ${theme.accent} text-white flex items-center justify-center text-xs`}>{i+1}</span>
                                {sec.title}
                            </h4>
                            <p className="text-sm text-slate-500 mb-4 px-2">{sec.intro}</p>
                            <div className="space-y-3">
                                {sec.blocks.map((block, bi) => {
                                    let colors = "bg-white border-slate-100";
                                    let icon = "check-circle";
                                    if(block.type === 'tip') { colors = "bg-amber-50 border-amber-100"; icon = "lightbulb"; }
                                    if(block.type === 'warning') { colors = "bg-red-50 border-red-100"; icon = "alert-triangle"; }
                                    if(block.type === 'info') { colors = "bg-blue-50 border-blue-100"; icon = "info"; }
                                    if(block.type === 'success') { colors = "bg-green-50 border-green-100"; icon = "zap"; }
                                    
                                    return (
                                        <div key={bi} className={`p-4 rounded-2xl border-2 ${colors} flex gap-3 shadow-sm`}>
                                            <Icon name={icon} size={18} className="shrink-0 mt-0.5" />
                                            <div>
                                                <p className="font-bold text-sm mb-1">{block.title}</p>
                                                <p className="text-xs leading-relaxed opacity-80" dangerouslySetInnerHTML={{ __html: block.text.replace(/`([^`]+)`/g, '<code class="bg-black/5 px-1 rounded font-bold">$1</code>') }} />
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    ))}
                    <div className="bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl">
                        <h4 className="font-black uppercase tracking-widest text-xs text-amber-400 mb-4 flex items-center gap-2">
                            <Icon name="rocket" size={16}/> Deine Missionen
                        </h4>
                        <ul className="space-y-3">
                            {data.missions.map((m, mi) => (
                                <li key={mi} className="text-xs flex gap-3 opacity-90 leading-snug">
                                    <span className="text-amber-400 font-black">•</span> {m}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [studentData, setStudentData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeStage, setActiveStage] = useState("5-6");
            const [selectedModule, setSelectedModule] = useState(null);

            useEffect(() => {
                const bootstrap = async () => {
                    try {
                        await msalInitPromise;
                        await msalInstance.handleRedirectPromise();
                        let account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
                        if (account) {
                            setUser(account);
                            fetchData(account);
                        } else {
                            setLoading(false);
                        }
                    } catch (e) { setLoading(false); }
                };
                bootstrap();
            }, []);

            const fetchData = async (account) => {
                try {
                    const tokenRes = await msalInstance.acquireTokenSilent({ scopes: ["Sites.Read.All"], account });
                    const url = `https://graph.microsoft.com/v1.0/sites/${MS_CONFIG.siteId}/lists/${MS_CONFIG.listId}/items?$expand=fields&$top=999`;
                    const res = await fetch(url, { headers: { Authorization: `Bearer ${tokenRes.accessToken}`, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" }});
                    const data = await res.json();
                    const record = data.value.find(item => item.fields.Title.toLowerCase() === account.username.toLowerCase());
                    if (record) {
                        setStudentData({
                            vorname: record.fields.Vorname,
                            nachname: record.fields.Nachname,
                            klasse: record.fields.Klasse,
                            completed: record.fields.Erledigte_Module ? record.fields.Erledigte_Module.split(',').map(m => parseInt(m.trim())) : []
                        });
                    }
                } catch (e) {} finally { setLoading(false); }
            };

            const handleLogin = () => {
                setLoading(true);
                msalInstance.loginRedirect({ scopes: ["Sites.Read.All"] });
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="spinner"></div></div>;

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full text-center border">
                        <Icon name="graduation-cap" size={48} className="text-[#BF0D3E] mx-auto mb-6" />
                        <h2 className="text-3xl font-black mb-2 uppercase tracking-tighter">Medienpass</h2>
                        <p className="text-slate-500 mb-8 font-medium">Gymnasium Thomaeum</p>
                        <button onClick={handleLogin} className="w-full bg-[#BF0D3E] text-white font-black py-4 rounded-2xl shadow-lg hover:scale-105 transition-all uppercase tracking-widest text-sm">Anmelden</button>
                    </div>
                </div>
            );

            const progress = Math.round(((studentData?.completed?.length || 0) / 13) * 100);

            return (
                <div className="min-h-screen pb-20">
                    {/* Wissensspeicher Overlay */}
                    {selectedModule && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="bg-[#BF0D3E] text-white p-6 sm:p-8 flex justify-between items-center shrink-0">
                                    <h2 className="text-xl sm:text-2xl font-black tracking-tight uppercase">{selectedModule.title}</h2>
                                    <button onClick={() => setSelectedModule(null)} className="bg-white/20 p-2 rounded-xl"><Icon name="x" size={24} /></button>
                                </div>
                                <div className="p-6 sm:p-10 overflow-y-auto custom-scroll">
                                    <RenderWissensspeicher module={selectedModule} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header mit Fortschritt */}
                    <header className="bg-[#BF0D3E] text-white pt-12 pb-16 px-8 rounded-b-[3rem] shadow-lg">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="text-center md:text-left">
                                <h1 className="text-3xl sm:text-4xl font-black uppercase tracking-tighter">Hallo {studentData?.vorname}!</h1>
                                <p className="text-red-200 font-bold opacity-80">Klasse {studentData?.klasse} • Gymnasium Thomaeum</p>
                            </div>
                            <div className="bg-white/10 p-5 rounded-[2.5rem] backdrop-blur-md border border-white/20 text-center min-w-[200px] shadow-inner">
                                <p className="text-[10px] font-black uppercase tracking-widest mb-1 opacity-70">Dein Fortschritt</p>
                                <p className="text-4xl font-black">{progress}%</p>
                                <div className="h-2 w-full bg-white/20 rounded-full mt-3 overflow-hidden relative">
                                    <div className="bg-white h-full transition-all duration-1000" style={{width: `${progress}%`}}></div>
                                    <div className="absolute top-0 bottom-0 left-[33%] w-px bg-white/20"></div>
                                    <div className="absolute top-0 bottom-0 left-[66%] w-px bg-white/20"></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content mit Reitern */}
                    <main className="max-w-5xl mx-auto px-6 -mt-8 relative z-20">
                        <div className="flex gap-2 mb-8 overflow-x-auto pb-4 scrollbar-hide">
                            {["5-6", "7-8", "9-10"].map(s => (
                                <button key={s} onClick={() => setActiveStage(s)} className={`px-10 py-5 rounded-[2rem] font-black transition-all shadow-sm flex-shrink-0 ${activeStage === s ? 'bg-white text-[#BF0D3E] scale-105 shadow-md' : 'bg-[#BF0D3E]/10 text-[#BF0D3E]/40'}`}>
                                    KLASSE {s}
                                </button>
                            ))}
                        </div>

                        {["skills", "reflexion"].map(cat => (
                            <div key={cat} className="mb-12">
                                <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
                                    <Icon name={cat === 'skills' ? 'wrench' : 'brain'} size={16} />
                                    {cat === 'skills' ? 'Anwendung (Skills)' : 'Umgang (Reflexion)'}
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {ALL_MODULES.filter(m => m.stage === activeStage && m.category === cat).map(m => {
                                        const done = studentData?.completed?.includes(m.id);
                                        return (
                                            <div key={m.id} onClick={() => done && setSelectedModule(m)} className={`p-6 rounded-[2.5rem] border-2 transition-all flex flex-col h-full relative ${done ? 'bg-white border-green-500 shadow-xl shadow-green-100 cursor-pointer hover:-translate-y-1' : 'bg-white/50 border-slate-100 opacity-60'}`}>
                                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mb-4 ${done ? 'bg-green-50 text-green-600' : 'bg-slate-100 text-slate-300'}`}>
                                                    <Icon name={m.icon} size={28} />
                                                </div>
                                                <h4 className={`font-black text-sm leading-tight uppercase ${done ? 'text-slate-800' : 'text-slate-400'}`}>{m.title}</h4>
                                                {done ? <div className="mt-auto pt-4 flex items-center gap-2 text-[10px] font-black text-green-600 uppercase tracking-widest"><Icon name="check-circle" size={14} /> Zertifiziert</div> : <div className="mt-auto pt-4 text-[10px] font-black text-slate-300 uppercase tracking-widest">Offen</div>}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
