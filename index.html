<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Medienpass | Gymnasium Thomaeum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.32.2/js/msal-browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --thomaeum-red: #BF0D3E; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: var(--thomaeum-red); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .font-black-caps { font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const MS_CONFIG = {
            tenantId: "09c4bd58-1b8c-410d-930e-816015e61028",
            clientId: "7d277b19-93c1-4df7-8f1b-d38749b3d440",
            siteId: "thomaeumde.sharepoint.com,9ef17c4d-b57b-482e-9168-3cc3bc43bc3d,d600d53b-cfd0-45f7-96a5-f1ac20222f8f",
            listId: "08da02d9-5b67-4938-9d7e-9e9dee97fa2e"
        };
        const THOMA_RED = "#BF0D3E";

        const msalConfig = {
            auth: {
                clientId: MS_CONFIG.clientId,
                authority: `https://login.microsoftonline.com/${MS_CONFIG.tenantId}`,
                redirectUri: window.location.origin,
                navigateToLoginRequestUrl: true
            },
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
        };
        
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const msalInitPromise = msalInstance.initialize();

        const ALL_MODULES = [
            { id: 1, title: "Hardware-Führerschein", stage: "5-6", category: "skills", icon: "monitor" }, 
            { id: 2, title: "Dateimanagement", stage: "5-6", category: "skills", icon: "folder" }, 
            { id: 3, title: "Umgang mit Word", stage: "5-6", category: "skills", icon: "file-text" },
            { id: 7, title: "Präsentationsprofi", stage: "5-6", category: "skills", icon: "presentation" },
            { id: 4, title: "Netiquette", stage: "5-6", category: "reflexion", icon: "message-square" }, 
            { id: 5, title: "Prävention", stage: "5-6", category: "reflexion", icon: "shield-alert" }, 
            { id: 6, title: "Suchmaschinen", stage: "5-6", category: "reflexion", icon: "search" },
            { id: 19, title: "Sichere Passwörter", stage: "5-6", category: "reflexion", icon: "key" },
            { id: 8, title: "Medienproduktion", stage: "7-8", category: "skills", icon: "video" }, 
            { id: 9, title: "Tabellenkalkulation", stage: "7-8", category: "skills", icon: "table" },
            { id: 20, title: "Bildbearbeitung", stage: "7-8", category: "skills", icon: "image" },
            { id: 21, title: "Audio & Podcasts", stage: "7-8", category: "skills", icon: "mic" },
            { id: 10, title: "Urheberrecht", stage: "7-8", category: "reflexion", icon: "copyright" }, 
            { id: 11, title: "Quellenkritik", stage: "7-8", category: "reflexion", icon: "check-circle" }, 
            { id: 12, title: "Datenschutz", stage: "7-8", category: "reflexion", icon: "lock" },
            { id: 22, title: "Social Media Check", stage: "7-8", category: "reflexion", icon: "smartphone" },
            { id: 13, title: "KI-Produktivität", stage: "9-10", category: "skills", icon: "cpu" }, 
            { id: 14, title: "Digitale Bewerbung", stage: "9-10", category: "skills", icon: "briefcase" }, 
            { id: 15, title: "Projektmanagement", stage: "9-10", category: "skills", icon: "kanban" },
            { id: 23, title: "Webdesign Basics", stage: "9-10", category: "skills", icon: "globe" },
            { id: 16, title: "KI-Ethik", stage: "9-10", category: "reflexion", icon: "scale" }, 
            { id: 17, title: "Zivilcourage", stage: "9-10", category: "reflexion", icon: "users" }, 
            { id: 18, title: "Digitaler Fußabdruck", stage: "9-10", category: "reflexion", icon: "footprint" },
            { id: 24, title: "Datenökonomie", stage: "9-10", category: "reflexion", icon: "database" }
        ];

        const MODULE_CONTENT_DATA = {
            3: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Word ist dein Werkzeug für Texte.", blocks: [{ type: 'tip', title: 'Tastenkürzel', text: 'Nutze `Strg + Z` zum Rückgängig machen.' }, { type: 'standard', title: 'Layout', text: 'Stelle Zeilenabstände auf 1,5 ein.' }] },
                    { title: "2. Kriterien für Qualität", intro: "Gute Texte sind übersichtlich.", blocks: [{ type: 'success', title: 'PDF Export', text: 'Speichere Dokumente immer als PDF.' }] }
                ],
                missions: ["Schreibe einen Satz fett.", "Füge ein Bild ein.", "Nutze Überschrift 1.", "Prüfe die Rechtschreibung.", "Exportiere als PDF."]
            },
            6: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Suchen wie ein Profi.", blocks: [{ type: 'tip', title: 'Operatoren', text: 'Nutze `""` für exakte Suchen.' }] },
                    { title: "2. Kriterien für Qualität", intro: "Quellen prüfen.", blocks: [{ type: 'warning', title: 'Werbung', text: 'Achte auf die Kennzeichnung "Anzeige".' }] }
                ],
                missions: ["Suche auf Blinde-Kuh.", "Nutze den Minus-Operator.", "Erkenne Werbe-Links.", "Finde das Thomaeum Gründungsjahr.", "Lies das Snippet."]
            }
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    setSvg(window.lucide.icons[name].toSvg({ width: size, height: size, class: className }));
                }
            }, [name, size, className]);
            return <span className={`inline-flex items-center justify-center ${className}`} dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        const RenderWissensspeicher = ({ module }) => {
            const data = MODULE_CONTENT_DATA[module.id];
            if (!data) return (
                <div className="text-center py-16 opacity-50">
                    <Icon name="book-open" size={48} className="mb-4" />
                    <h3 className="text-xl font-bold">Wissensspeicher folgt</h3>
                    <p className="text-sm">Inhalte werden aktuell eingepflegt.</p>
                </div>
            );

            return (
                <div className="space-y-10">
                    {data.sections.map((sec, i) => (
                        <div key={i}>
                            <h4 className="font-black text-lg text-slate-800 mb-4 flex items-center gap-2">
                                <span className="w-8 h-8 rounded-lg bg-[#BF0D3E] text-white flex items-center justify-center text-xs">{i+1}</span>
                                {sec.title}
                            </h4>
                            <p className="text-sm text-slate-500 mb-4">{sec.intro}</p>
                            <div className="space-y-3">
                                {sec.blocks.map((block, bi) => (
                                    <div key={bi} className="p-4 rounded-2xl border-2 border-slate-100 flex gap-3 shadow-sm bg-slate-50">
                                        <Icon name={block.type === 'warning' ? 'alert-triangle' : 'info'} size={18} className="shrink-0 mt-0.5 text-[#BF0D3E]" />
                                        <div>
                                            <p className="font-bold text-sm mb-1">{block.title}</p>
                                            <p className="text-xs opacity-80" dangerouslySetInnerHTML={{ __html: block.text.replace(/`(.*?)`/g, '<code class="bg-white/80 px-1 rounded font-bold border">$1</code>') }} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                    <div className="bg-amber-50 p-6 rounded-[2rem] border-2 border-amber-100">
                        <h4 className="font-black uppercase tracking-widest text-xs text-amber-600 mb-4 flex items-center gap-2">
                            <Icon name="rocket" size={16}/> Deine Missionen
                        </h4>
                        <ul className="space-y-3">
                            {data.missions.map((m, mi) => (
                                <li key={mi} className="text-xs flex gap-3 text-amber-900 font-medium">
                                    <span className="text-amber-400 font-black">•</span> {m}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [studentData, setStudentData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeStage, setActiveStage] = useState("5-6");
            const [selectedModule, setSelectedModule] = useState(null);

            useEffect(() => {
                const bootstrap = async () => {
                    try {
                        await msalInitPromise;
                        await msalInstance.handleRedirectPromise();
                        let account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
                        if (account) {
                            setUser(account);
                            fetchData(account);
                        } else { setLoading(false); }
                    } catch (e) { setLoading(false); }
                };
                bootstrap();
            }, []);

            const fetchData = async (account) => {
                try {
                    const tokenRes = await msalInstance.acquireTokenSilent({ scopes: ["Sites.Read.All"], account });
                    const url = `https://graph.microsoft.com/v1.0/sites/${MS_CONFIG.siteId}/lists/${MS_CONFIG.listId}/items?$expand=fields&$top=999`;
                    const res = await fetch(url, { headers: { Authorization: `Bearer ${tokenRes.accessToken}`, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" }});
                    const data = await res.json();
                    const record = data.value.find(item => item.fields.Title.toLowerCase() === account.username.toLowerCase());
                    if (record) {
                        setStudentData({
                            vorname: record.fields.Vorname,
                            nachname: record.fields.Nachname,
                            klasse: record.fields.Klasse,
                            completed: record.fields.Erledigte_Module ? record.fields.Erledigte_Module.split(',').map(m => parseInt(m.trim())) : [],
                            moduleDates: record.fields.Modul_Daten ? JSON.parse(record.fields.Modul_Daten) : {}
                        });
                    }
                } catch (e) {} finally { setLoading(false); }
            };

            const handleLogin = () => {
                setLoading(true);
                msalInstance.loginRedirect({ scopes: ["Sites.Read.All"] });
            };

            const handleLogout = () => {
                msalInstance.logoutRedirect({ postLogoutRedirectUri: window.location.origin });
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="spinner"></div></div>;

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6 text-center">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full border">
                        <Icon name="graduation-cap" size={48} className="text-[#BF0D3E] mx-auto mb-6" />
                        <h2 className="text-3xl font-black mb-2 uppercase tracking-tighter">Medienpass</h2>
                        <button onClick={handleLogin} className="mt-6 w-full bg-[#BF0D3E] text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest text-sm active:scale-95 transition-all">Anmelden</button>
                    </div>
                </div>
            );

            const progressCount = studentData?.completed?.length || 0;
            const progressPercent = Math.round((progressCount / 24) * 100);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Wissensspeicher Modal */}
                    {selectedModule && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="bg-[#BF0D3E] text-white p-6 sm:p-8 flex justify-between items-center shrink-0">
                                    <h2 className="text-xl sm:text-2xl font-black uppercase">{selectedModule.title}</h2>
                                    <button onClick={() => setSelectedModule(null)} className="bg-white/20 p-2 rounded-xl hover:bg-white/30 transition-all active:scale-95"><Icon name="x" size={24} /></button>
                                </div>
                                <div className="p-6 sm:p-10 overflow-y-auto custom-scroll">
                                    <RenderWissensspeicher module={selectedModule} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header - STYLED EXACTLY LIKE THE PROVIDED IMAGE */}
                    <header className="bg-[#BF0D3E] text-white pt-10 pb-16 px-6 sm:px-12 shadow-md relative z-10">
                        <div className="max-w-7xl mx-auto flex justify-between items-start mb-6">
                            <div>
                                <h1 className="text-4xl sm:text-5xl font-black uppercase tracking-tighter mb-1 leading-none">Hallo {studentData?.vorname}!</h1>
                                <p className="text-red-100 font-bold text-lg opacity-90">Klasse {studentData?.klasse} • Gymnasium Thomaeum</p>
                            </div>
                            <button onClick={handleLogout} className="bg-white/20 hover:bg-white/30 text-white px-6 py-3 rounded-2xl transition-all font-black text-lg shadow-lg active:scale-95">
                                Abmelden
                            </button>
                        </div>
                        
                        {/* THE NEW PROGRESS CARD FROM THE IMAGE */}
                        <div className="max-w-7xl mx-auto bg-black/20 p-8 rounded-[2.5rem] border border-white/10 shadow-inner">
                            <div className="flex justify-between items-baseline mb-4">
                                <span className="font-black uppercase tracking-widest text-sm text-white/80">Gesamtfortschritt</span>
                                <span className="font-black text-5xl sm:text-6xl text-white">{progressPercent}%</span>
                            </div>
                            <div className="h-6 bg-black/30 rounded-full overflow-hidden shadow-inner relative">
                                <div className="h-full bg-white rounded-full transition-all duration-1000 ease-out" style={{ width: `${progressPercent}%` }}></div>
                                {/* Divider marks for 33% and 66% */}
                                <div className="absolute top-0 bottom-0 left-[33.33%] w-px bg-white/10"></div>
                                <div className="absolute top-0 bottom-0 left-[66.66%] w-px bg-white/10"></div>
                            </div>
                            <p className="text-right mt-3 text-xs font-black text-white/60 uppercase tracking-widest">{progressCount} von 24 Modulen geschafft</p>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto w-full px-6 sm:px-12 -mt-8 relative z-20 pb-20">
                        {/* Tabs */}
                        <div className="flex gap-4 mb-8 overflow-x-auto pb-4 scrollbar-hide">
                            {["5-6", "7-8", "9-10"].map(stage => (
                                <button 
                                    key={stage} 
                                    onClick={() => setActiveStage(stage)} 
                                    className={`px-10 py-5 rounded-[2rem] font-black text-xl transition-all shadow-md whitespace-nowrap ${activeStage === stage ? 'bg-white text-[#BF0D3E] shadow-xl scale-105' : 'bg-[#BF0D3E] text-white border border-white/20 hover:bg-red-700'}`} 
                                >
                                    Klasse {stage}
                                </button>
                            ))}
                        </div>

                        {/* Grid */}
                        <div className="space-y-12">
                            {["skills", "reflexion"].map(cat => (
                                <div key={cat}>
                                    <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
                                        <Icon name={cat === 'skills' ? 'wrench' : 'brain'} size={16} />
                                        {cat === 'skills' ? 'Anwendung (Skills)' : 'Umgang (Reflexion)'}
                                    </h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {ALL_MODULES.filter(m => m.stage === activeStage && m.category === cat).map(modul => {
                                            const isDone = studentData?.completed?.includes(modul.id);
                                            const moduleData = studentData?.moduleDates?.[modul.id];
                                            let dateDone = "—";
                                            let teacherName = "";
                                            if (moduleData) {
                                                if (typeof moduleData === 'string') { dateDone = moduleData; }
                                                else { dateDone = moduleData.datum || "—"; teacherName = moduleData.lehrer || ""; }
                                            }

                                            return (
                                                <div 
                                                    key={modul.id} 
                                                    onClick={() => isDone && setSelectedModule(modul)}
                                                    className={`bg-white rounded-[2.5rem] p-8 border-4 transition-all flex flex-col h-full shadow-sm ${isDone ? 'border-green-400 cursor-pointer hover:shadow-xl hover:-translate-y-1' : 'border-slate-50 opacity-60'}`}
                                                >
                                                    <div className="flex justify-between items-start mb-6">
                                                        <span className="text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-400 px-3 py-1 rounded-lg">Klasse {modul.stage}</span>
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${isDone ? 'bg-green-500 text-white shadow-md' : 'bg-slate-100 text-slate-200'}`}>
                                                            {isDone ? <Icon name="check" size={20} /> : <Icon name="lock" size={16} />}
                                                        </div>
                                                    </div>
                                                    
                                                    <h3 className={`font-black text-2xl tracking-tight leading-tight mb-6 ${isDone ? 'text-slate-800' : 'text-slate-400'}`}>
                                                        {modul.title}
                                                    </h3>
                                                    
                                                    <div className="mt-auto">
                                                        {isDone ? (
                                                            <div className="space-y-1">
                                                                <p className="text-[10px] font-black text-green-500 uppercase">Zertifiziert am {dateDone}</p>
                                                                {teacherName && <p className="text-[10px] font-black text-slate-400 uppercase">durch {teacherName}</p>}
                                                            </div>
                                                        ) : (
                                                            <p className="text-xs font-black text-slate-300 uppercase tracking-widest">Noch offen</p>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
