                                text: 'Voraussetzung: Du hast deine Überschriften mit den Formatvorlagen **„Überschrift 1"** und **„Überschrift 2"** formatiert. Dann: Setze den Cursor an die Stelle, wo das Inhaltsverzeichnis erscheinen soll. Gehe zu **Referenzen → Inhaltsverzeichnis → Automatische Tabelle 1**. Word erstellt das Verzeichnis mit allen Überschriften und Seitenzahlen. Wenn du später etwas änderst: Rechtsklick auf das Verzeichnis → **„Felder aktualisieren"**.'
                            },
                            {
                                type: 'tip',
                                title: 'Bilder einfügen ohne Chaos',
                                text: 'Gehe zu **Einfügen → Bilder → Dieses Gerät**. Das Bild erscheint oft mitten im Text und zerreißt alles. Klicke das Bild an, wähle die kleinen **Layoutoptionen** (erscheinen rechts neben dem Bild) und stelle **„Quadrat"** ein. Jetzt fließt der Text um das Bild herum. Verändere die Bildgröße immer nur an den **Ecken** (nicht an den Seiten), sonst verzerrt das Bild.'
                            },
                            {
                                type: 'success',
                                title: 'Fertige Dokumente als PDF exportieren',
                                text: 'Gehe zu **Datei → Speichern unter → Dateityp: PDF**. Ein PDF ist wie ein digitales Foto deines Dokuments – Schrift, Abstände und Bilder bleiben auf jedem Computer genau gleich. Abgaben an Lehrkräfte immer als **PDF**, niemals als .docx – die Formatierung könnte sonst beim Öffnen verrutschen, besonders wenn der Empfänger eine andere Word-Version hat.'
                            }
                        ]

            2: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Egal ob PowerPoint oder Keynote – Präsentationen zu bauen macht Spaß, wenn man die Kniffe kennt.", blocks: [
                        { type: 'standard', title: 'Neue Folien und Bilder', text: 'Klicke auf "Neue Folie" und wähle direkt das passende Layout (z.B. "Titel und Inhalt"). So verrutschen die Textfelder nicht. Bilder fügst du über "Einfügen > Bilder" ein. Verändere die Größe von Bildern **immer nur an den Ecken**, sonst quetschst du das Bild!', image: '' },
                        { type: 'tip', title: 'Design leicht gemacht', text: 'Du musst kein Künstler sein. Nutze den eingebauten **Designer** (in PowerPoint oft rechts an der Seite zu finden). Er schlägt dir automatisch professionelle und wunderschöne Layouts für deine eingefügten Texte und Bilder vor.' }
                    ]},
                    { title: "2. Kriterien für Qualität", intro: "Die schlimmste Präsentation ist die, die komplett mit Text vollgeschrieben ist.", blocks: [
                        { type: 'warning', title: 'Wenig Text, große Bilder', text: 'Auf Folien gehören nur extrem kurze Stichpunkte, niemals ganze Sätze! Ein starkes, großes Bild ist viel besser als zehn Zeilen Text. Die Folie soll unterstützen, was du sagst, nicht deinen Text ersetzen.' },
                        { type: 'info', title: 'Du bist der Star!', text: 'Lies niemals einfach den Text von der Folie ab. Das Publikum kann selbst lesen. Nutze kleine Karteikarten für deine Sätze und sprich frei zum Publikum. Die Aufmerksamkeit gehört dir, nicht der Wand hinter dir.', image: '' }
                    ]}

                missions: ["Erstelle eine Titelfolie mit deinem Namen und dem Thema 'Mein Lieblingstier'.", "Füge eine zweite Folie hinzu und schreibe exakt 3 extrem kurze Stichpunkte auf.", "Füge ein Foto deines Lieblingstiers ein und ziehe es groß.", "Klicke den 'Designer' an und wähle einen coolen Vorschlag für deine Folie.", "Teste den Präsentations-Modus (Vollbild) und wechsle die Folien mit der Tastatur."]
            },
            3: {
                sections: [
                    { title: "1. Netiquette – Respekt im digitalen Alltag", intro: "Das Internet ist kein rechtsfreier Raum. Auch wenn man sich nicht in die Augen schaut, gelten klare Regeln – und hinter jedem Bildschirm sitzt ein echter Mensch.", blocks: [
                        { type: 'info', title: 'Die goldene Regel', text: 'Schreibe im Internet niemals etwas, das du der Person nicht auch direkt ins Gesicht sagen würdest. Hinter jedem Profilbild und Chatnamen steckt ein echter Mensch mit echten Gefühlen.' },
                        { type: 'warning', title: 'BITTE NICHT SCHREIEN!', text: 'Großbuchstaben bedeuten in der Chat-Sprache, dass du brüllst: `ICH BIN SO WÜTEND` wirkt aggressiv, selbst wenn du es gar nicht so meinst. Nutze Großbuchstaben nur für echte Begeisterung – und auch dann sparsam.' },
                        { type: 'standard', title: 'Ironie und Missverständnisse', text: 'Im Chat kann niemand dein Lachen hören oder dein Augenzwinkern sehen. Witze werden deshalb oft falsch verstanden und wirken plötzlich gemein. Nutze passende Emojis (😄, 😜), um zu zeigen, wie ein Satz gemeint ist – aber übertreibe es nicht.' },
                        { type: 'success', title: 'Erst denken, dann posten', text: 'Das Internet vergisst nicht. Auch wenn du eine Nachricht „für alle löschst" – jemand könnte bereits einen Screenshot gemacht haben. Wenn du wütend bist: Leg das Gerät weg, atme durch und schreibe erst morgen.' }
                    ]},
                    { title: "2. Cybermobbing – erkennen, reagieren, helfen", intro: "Cybermobbing ist mehr als ein blöder Kommentar. Es hört nach der Schule nicht auf, sondern verfolgt das Opfer bis ins eigene Zimmer.", blocks: [
                        { type: 'warning', title: 'Was ist Cybermobbing?', text: 'Wenn jemand online absichtlich, wiederholt und über längere Zeit fertiggemacht wird – durch Beleidigungen, peinliche Fotos, Lügen oder bewusstes Ausschließen aus Gruppen – ist das Cybermobbing. Es ist kein Spaß, sondern kann echten psychischen Schaden anrichten.' },
                        { type: 'standard', title: 'Beweise sichern', text: 'Der erste Impuls ist oft, fiese Nachrichten schnell zu löschen. **Falsch!** Mache sofort Screenshots von allem, bevor der Täter es löschen kann. Diese Beweise sind wichtig, wenn du dich Erwachsenen oder der Schule anvertraust.', image: '' },
                        { type: 'tip', title: 'Nicht zurückbeleidigen', text: 'Lass dich nicht auf das Niveau der Täter herab. Wer zurückbeleidigt, macht die Situation oft schlimmer und macht sich selbst angreifbar. Blockieren ist stärker als Antworten.' },
                        { type: 'success', title: 'Hilfe holen ist mutig', text: 'Sprich sofort mit deinen Eltern, Lehrerinnen oder dem Schulsozialarbeiter. Wenn du das (noch) nicht möchtest, kannst du dich anonym bei der **Nummer gegen Kummer (116 111)** melden. Wegschauen hilft nur den Tätern – auch als Zuschauer trägst du Verantwortung.' }
                    ]}
                ],
                missions: [
                    "Schreibe eine freundliche, motivierende Nachricht an eine Mitschülerin oder einen Mitschüler – achte bewusst auf Ton und Formulierung.",
                    "Schreibe denselben Satz einmal normal und einmal komplett in GROSSBUCHSTABEN: Wie verändert sich die Wirkung?",
                    "Lies deine letzten drei Nachrichten in einem Klassenchat durch: Waren sie respektvoll? Würdest du sie auch direkt so sagen?",
                    "Finde heraus, wie man bei WhatsApp, Instagram oder TikTok jemanden blockiert und einen Inhalt meldet.",
                    "Notiere die Telefonnummer der Nummer gegen Kummer (116 111) in deinen Kontakten."
                ]
            },
            4: {
                sections: [
                    { title: "Clever suchen", intro: "Stell dir das Internet wie eine gigantische Bibliothek vor. Eine Suchmaschine sucht nicht 'live', wenn du auf Enter drückst!", blocks: [
                        { type: 'info', title: 'Die Spinnen und der Index', text: 'Kleine, unsichtbare Programme der Suchmaschinen (Crawler oder Spinnen) krabbeln Tag und Nacht durchs Internet und lesen Webseiten. Sie packen alle Wörter in ein riesiges Inhaltsverzeichnis (den **Index**). Du suchst also nur in diesem Index, deshalb geht es so schnell!', image: '' },
                        { type: 'tip', title: 'Die perfekten Keywords', text: 'Tippe niemals ganze Sätze in die Suchleiste ein! Suchmaschinen verstehen Schlagwörter (Keywords) viel besser. \n❌ Falsch: *Was fressen Eisbären im Winter?* \n✅ Richtig: `Eisbär Nahrung Winter`' },
                        { type: 'standard', title: 'Suchoperatoren (Profi-Tricks)', text: 'Mit dem **Minus-Zeichen (-)** schließt du Wörter aus. Beispiel: `Jaguar -Auto` findet nur das Tier. Mit **Anführungszeichen (" ")** suchst du nach exakt dieser Wortfolge, z.B. `"Gymnasium Thomaeum"`.' }
                    ]},
                    { title: "Treffer bewerten", intro: "Nicht alles was ganz oben steht, ist auch wahr oder für dich geeignet.", blocks: [
                        { type: 'warning', title: 'Werbung erkennen', text: 'Der erste Treffer ist nicht immer der beste! Firmen bezahlen viel Geld, um ganz oben zu stehen. Diese gekaufte Treffer haben ein kleines Wort wie **"Anzeige"** oder **"Gesponsert"** neben sich. Überspringe sie lieber.', image: '' },
                        { type: 'success', title: 'Sichere Alternativen für Kinder', text: 'Google ist ein Riese, aber oft unübersichtlich. Nutze Suchmaschinen, die das Internet filtern und dir nur sichere, leicht verständliche und werbefreie Seiten zeigen: **FragFINN.de**, **Blinde-Kuh.de** oder **Helles-Koepfchen.de**.' }
                    ]}
                ],
                missions: ["Suche auf Blinde-Kuh.de nach Informationen über den Planeten Mars.", "Nutze bei Google den Minus-Trick: Suche nach 'Römer -Auto'.", "Suche bei Google nach dem Wort 'Schuhe' und zähle, wie viele Ergebnisse oben als 'Anzeige' markiert sind.", "Finde durch eine clevere Suche heraus, an welchem genauen Datum die Schule 'Gymnasium Thomaeum' gegründet wurde.", "Erkläre deinem Sitznachbarn in einem Satz, warum der erste Treffer bei Google nicht immer der beste ist."]
            },
            5: {
                sections: [
                    { title: "Warum Passwörter wichtig sind", intro: "Dein Passwort ist der digitale Haustürschlüssel zu deinem Leben. Wenn er zu simpel ist, können Fremde einfach eintreten.", blocks: [
                        { type: 'warning', title: 'Was Hacker lieben', text: 'Ein schlechtes Passwort (wie `123456`, `hallo` oder der Name deines Hundes) lässt sich von speziellen Computerprogrammen in weniger als einer Sekunde knacken. Diese Programme probieren einfach Millionen Wörter pro Sekunde aus.', image: '' },
                        { type: 'info', title: 'Streng geheim!', text: 'Verrate dein Passwort niemals deinen Freunden! Auch nicht deiner besten Freundin. Wenn ihr euch mal streitet, kann das böse enden. Nur du und im Notfall deine Eltern sollten es kennen.' }
                    ]},
                    { title: "Das perfekte Passwort", intro: "Ein gutes Passwort ist lang, aber trotzdem leicht zu merken.", blocks: [
                        { type: 'standard', title: 'Länge schlägt Komplexität', text: 'Ein Passwort sollte mindestens **12 Zeichen** lang sein. Je länger es ist, desto exponentiell länger braucht ein Computer, um es zu erraten.' },
                        { type: 'tip', title: 'Der Merksatz-Trick', text: 'Denke dir einen völlig verrückten Quatsch-Satz aus, den du dir gut merken kannst. Zum Beispiel: *Ich esse jeden Morgen 3 grüne Äpfel!* Nimm nun nur die Anfangsbuchstaben und die Satzzeichen: `IejM3gÄ!` – und schon hast du ein Passwort, das extrem sicher ist.', image: '' }
                    ]}
                ],
                missions: ["Erfinde einen richtig verrückten, witzigen Merksatz für ein neues Passwort.", "Wandle diesen Merksatz in ein sicheres Passwort um (Anfangsbuchstaben, Zahlen und Sonderzeichen).", "Prüfe gedanklich dein aktuelles Passwort für die Schule: Ist es wirklich länger als 8 Zeichen?", "Überlege dir, warum 'Passwort123' das unsicherste Passwort der Welt ist.", "Finde durch eine Internetsuche heraus, was ein 'Passwort-Manager' ist und wie er helfen kann."]
            },

            // ================== KLASSE 7-8 ==================
            6: {
                sections: [
                    { title: "1. Bildbearbeitung", intro: "Ein gutes Foto entsteht nicht nur mit der Kamera – oft ist die Nachbearbeitung entscheidend. Hier lernst du die wichtigsten Werkzeuge kennen.", blocks: [
                        { type: 'standard', title: 'Zuschneiden (Crop)', text: 'Das wichtigste Werkzeug der Bildbearbeitung! Schneide störende Ränder oder ablenkende Hintergrundelemente weg, um den Fokus des Betrachters gezielt auf dein Hauptmotiv zu lenken.', image: '' },
                        { type: 'info', title: 'Helligkeit, Kontrast und Farbe', text: 'Ein flaues Bild rettest du durch mehr Kontrast. Aber Vorsicht: Zu viel Helligkeit lässt helle Flächen "ausbrennen" – sie werden komplett weiß und verlieren alle Details. Nutze den Regler **Weißabgleich** (Temperatur), um Farbstiche zu korrigieren: Ein zu gelbes Kunstlicht-Foto wird durch einen Zug ins Blaue neutralisiert.' },
                        { type: 'warning', title: 'Weniger ist mehr', text: 'Ein Instagram-Filter auf 100% wirkt oft künstlich und billig. Reduziere die Deckkraft auf 30–50% für einen professionellen Look. Und: Verändere niemals Körperproportionen von Menschen – das erzeugt gefährliche und unrealistische Schönheitsideale.', image: '' }
                    ]},
                    { title: "2. Videobearbeitung", intro: "Ein gutes Video entsteht nicht beim Filmen, sondern beim Schnitt. Wer schneiden kann, kann Geschichten erzählen.", blocks: [
                        { type: 'standard', title: 'Die Zeitleiste (Timeline)', text: 'Schnitt-Programme wie iMovie oder CapCut arbeiten mit einer Zeitleiste. Du importierst deine Clips und legst sie nacheinander ab. Mit dem **Split-Werkzeug** zerschneidest du Clips, um Pausen oder Versprecher herauszulöschen.', image: '' },
                        { type: 'tip', title: 'Audio und Musik', text: 'Lege Hintergrundmusik auf eine zweite Audio-Spur unter dein Video. Nutze **Ducking** (Lautstärke senken), damit die Musik leiser wird, sobald jemand spricht. So klingt das Ergebnis professionell und ausgewogen.' },
                        { type: 'warning', title: 'Exportieren nicht vergessen', text: 'Wenn du fertig bist, musst du das Video exportieren (rendern). Speichere immer als **.MP4** – die Projektdatei des Schnittprogramms kann niemand anderes öffnen!' }
                    ]},
                    { title: "3. Kriterien für Qualität", intro: "Was unterscheidet professionelle digitale Medien von schnell hingepfuschten Ergebnissen?", blocks: [
                        { type: 'success', title: 'Der rote Faden (Storytelling)', text: 'Egal ob Bild oder Video – jede gute Produktion erzählt eine Geschichte. Ein starkes Bild hat ein klares Hauptmotiv. Ein gutes Video hat einen **Hook** (spannender Einstieg), einen informativen Hauptteil und ein klares Ende.' },
                        { type: 'tip', title: 'Kurz und knackig', text: 'Beim Videoschnitt gilt: Sei gnadenlos. Entferne alles, was die Geschichte nicht voranbringt. Ein 2-minütiges, spannendes Video ist immer besser als ein 10-minütiges, langatmiges.' },
                        { type: 'info', title: 'Ethik in der Bildbearbeitung', text: 'Digitale Medien können täuschen. Überlege bei jeder Bearbeitung: Optimiere ich ein Bild, oder manipuliere ich es? Das Verfälschen von Nachrichtenbildern oder das Retuschieren von Körpern ist nicht nur unethisch, sondern kann echten Schaden anrichten.' }
                    ]}
                ],
                missions: [
                    "Mache ein Foto von einem Gegenstand in deiner Nähe und schneide alle störenden Ränder weg.",
                    "Bearbeite dasselbe Foto: Erhöhe den Kontrast leicht und korrigiere ggf. einen Farbstich mit dem Weißabgleich.",
                    "Nimm ein kurzes, 15-sekündiges Video auf und schneide mindestens eine Pause oder einen Versprecher heraus.",
                    "Lege eine kurze, lizenzfreie Hintergrundmusik unter dein Video und senke ihre Lautstärke auf ein angenehmes Niveau.",
                    "Exportiere dein fertiges Video als .MP4 und vergleiche die Dateigröße mit der ursprünglichen Projektdatei."
                ]
            },
            7: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Excel und Calc wirken auf den ersten Blick wie riesige, unübersichtliche Gitter. Aber sie nehmen dir all die harte Rechenarbeit ab.", blocks: [
                        { type: 'info', title: 'Das Koordinatensystem', text: 'Jedes Kästchen (Zelle) hat eine eindeutige Adresse, bestehend aus der Spalte (Buchstabe) und der Zeile (Zahl), z.B. **B4**.' },
                        { type: 'warning', title: 'Formeln richtig starten', text: 'Wenn Excel für dich rechnen soll, MUSS in der Zelle immer zuerst ein **Gleichheitszeichen (=)** stehen. Ohne das `=` denkt Excel, du schreibst einfach nur normalen Text.' },
                        { type: 'standard', title: 'Die Summen-Funktion', text: 'Um viele Zahlen blitzschnell zusammenzurechnen, tippe `=SUMME(A1:A5)`. Das rechnet alle Werte von Zelle A1 bis A5 zusammen. Ändert sich später eine Zahl, passt sich die Summe magisch automatisch an!' }
                    ]},
                    { title: "2. Kriterien für Qualität", intro: "Rohe Zahlenkolonnen sind für den Betrachter extrem langweilig. Du musst sie visualisieren.", blocks: [
                        { type: 'tip', title: 'Übersichtlichkeit schaffen', text: 'Mache Spalten-Überschriften immer fett und gib ihnen eine leichte Hintergrundfarbe. Nutze die Rahmen-Funktion, um echte Tabellenlinien zu ziehen, sonst sieht es beim Ausdrucken furchtbar aus.' },
                        { type: 'success', title: 'Diagramme sprechen lassen', text: 'Markiere deine Daten und erstelle ein Kreisdiagramm (für Prozentanteile) oder ein Säulendiagramm (für Vergleiche). WICHTIG: Ein Diagramm ohne aussagekräftigen Titel und beschriftete Achsen ist absolut wertlos!', image: '' }
                    ]}
                ],
                missions: ["Öffne Excel/Calc und trage in Spalte A untereinander deine 3 Lieblingsessen ein.", "Trage in Spalte B fiktive Preise für diese Essen ein.", "Berechne in einer neuen Zelle die Summe der Preise mit der Formel `=SUMME()`.", "Markiere die Essen und die Preise und erstelle ein Säulendiagramm.", "Gib deinem Diagramm einen passenden Titel (z.B. 'Meine Essenskosten')."]
            },
            8: {
                sections: [
                    { title: "1. Professionelle Aufnahmetechnik", intro: "Gute Audio-Produktionen scheitern fast immer an technischen Grundfehlern. Wer diese kennt und vermeidet, klingt sofort professionell.", blocks: [
                        { type: 'warning', title: 'Pegel und Übersteuerung', text: 'Der Aufnahmepegel sollte dauerhaft bei ca. **-12 dB** liegen – nicht am oberen Limit. Berührt der Ausschlag die rote Linie (0 dB), übersteuert die Aufnahme und das Signal verzerrt dauerhaft. Das ist im Nachhinein nicht mehr korrigierbar. Nutze in Audacity oder GarageBand immer die Pegelanzeige als Kontrolle.', image: '' },
                        { type: 'standard', title: 'Akustik und Raumklang', text: 'Professionelle Studios sind mit schallschluckenden Materialien ausgekleidet. Zu Hause gilt: Aufnahmen in kleinen, vollgestellten Räumen mit Teppich und Vorhängen klingen deutlich trockener und wärmer als in leeren Zimmern. Ein einfacher Trick: Nimm unter einer dicken Bettdecke auf – das schluckt nahezu jeglichen Hall.' },
                        { type: 'info', title: 'Mehrspurige Produktion', text: 'Professionelle Podcasts bestehen aus mindestens drei Spuren: **Stimme**, **Hintergrundmusik** und ggf. **Soundeffekte**. Arbeite in einem Programm wie Audacity oder GarageBand mit getrennten Spuren, damit du Lautstärken unabhängig voneinander regeln kannst. Die Musik sollte während des Sprechens auf ca. **-20 dB** abgesenkt sein (Ducking).' },
                        { type: 'tip', title: 'Exportformate und Qualität', text: 'Für die Veröffentlichung gilt: **MP3 mit 192 kbps** ist der Standard für Podcasts – gute Qualität bei überschaubarer Dateigröße. Für die Archivierung oder Weiterbearbeitung speicherst du immer als unkomprimiertes **WAV**. Niemals eine bereits komprimierte MP3 erneut als MP3 exportieren – das verschlechtert die Qualität jedes Mal.' }
                    ]},
                    { title: "2. Dramaturgie und Inhalt", intro: "Technik allein macht noch keinen guten Podcast. Entscheidend ist, wie du deinen Inhalt strukturierst und präsentierst.", blocks: [
                        { type: 'standard', title: 'Das 3-Akt-Modell für Podcasts', text: 'Jede gute Podcast-Episode folgt einer klaren Dramaturgie: **Akt 1 (Hook):** Die ersten 60 Sekunden entscheiden, ob jemand weiterhört. Stelle sofort die zentrale Frage oder These, die du in der Folge beantwortest. **Akt 2 (Hauptteil):** Belege, Argumente, Perspektiven – strukturiert und mit Übergängen. **Akt 3 (Fazit):** Fasse die Kernaussage in einem Satz zusammen und gib einen Ausblick auf die nächste Folge.' },
                        { type: 'tip', title: 'Scripten vs. freies Sprechen', text: 'Ein vollständig ausgeschriebenes Skript klingt oft abgelesen und leblos. Profis arbeiten mit einem **Stichwort-Skript**: Die Struktur und alle wichtigen Fakten stehen fest, die genaue Formulierung entsteht im Moment des Sprechens. Das klingt natürlicher und spontaner.' },
                        { type: 'info', title: 'Podcast als journalistisches Medium', text: 'Podcasts sind heute ein ernstzunehmendes journalistisches Format. Wenn du Fakten nennst, Personen zitierst oder Statistiken verwendest, gelten dieselben journalistischen Sorgfaltspflichten wie in einem Zeitungsartikel: Quellen prüfen, Aussagen belegen, unterschiedliche Perspektiven abbilden.' },
                        { type: 'warning', title: 'Urheberrecht bei Musik und Tönen', text: 'Musik aus Spotify oder YouTube ist urheberrechtlich geschützt und darf nicht einfach als Podcast-Untermalung genutzt werden – auch nicht für "nicht-kommerzielle" Projekte. Nutze ausschließlich lizenzfreie Musik von Plattformen wie **ccmixter.org**, **freemusicarchive.org** oder die **YouTube Audio Library**.' }
                    ]}
                ],
                missions: [
                    "Recherchiere drei Podcasts zu einem Thema, das dich wirklich interessiert, und analysiere deren Struktur: Wie lang ist der Hook? Gibt es ein festes Intro?",
                    "Erstelle ein Stichwort-Skript für eine 3-minütige Podcast-Episode zu einem selbst gewählten Thema.",
                    "Nimm die Episode auf und überprüfe den Pegel: Liegt er konstant bei ca. -12 dB?",
                    "Bearbeite die Aufnahme in Audacity: Entferne störende Pausen und Versprecher und lege eine lizenzfreie Hintergrundmusik auf eine zweite Spur.",
                    "Exportiere das fertige Ergebnis als MP3 (192 kbps) und lass eine andere Person zuhören – hol dir gezieltes Feedback zu Tempo, Verständlichkeit und Struktur."
                ]
            },
            9: {
                sections: [
                    { title: "1. Quellen finden und bewerten", intro: "Im Geschichtsunterricht lernst du, Quellen kritisch zu analysieren. Dasselbe Handwerkszeug brauchst du im digitalen Alltag – denn im Internet kann jeder alles behaupten.", blocks: [
                        { type: 'info', title: 'Was ist überhaupt eine Quelle?', text: 'Eine Quelle ist alles, woraus du Informationen beziehst: ein Wikipedia-Artikel, ein YouTube-Video, ein Zeitungsartikel, ein Foto oder ein historisches Dokument. Entscheidend ist immer die Frage: **Wer hat das erstellt, wann, und mit welchem Ziel?**' },
                        { type: 'warning', title: 'Fake News erkennen', text: 'Absichtlich erfundene oder verfälschte Nachrichten (Fake News) sollen Leser emotional aufregen, Klicks generieren oder politische Gegner schädigen. Ein sicheres Warnsignal: reißerische Überschriften mit Ausrufezeichen, extreme Emotionalisierung oder fehlende Quellenangaben. Seriöse Medien wie die Tagesschau verzichten auf solche Mittel.', image: '' },
                        { type: 'standard', title: 'Die 2-Quellen-Regel', text: 'Lies eine schockierende Behauptung? Suche dasselbe Thema bei Google News. Berichten auch andere, unabhängige und seriöse Medien darüber? Wenn nicht, ist es mit hoher Wahrscheinlichkeit falsch oder stark übertrieben.' },
                        { type: 'tip', title: 'Bilder-Rückwärtssuche', text: 'Oft werden echte Fotos aus einem anderen Kontext herausgerissen und neu interpretiert. Lade ein verdächtiges Bild bei der **Google Bilderrückwärtssuche** hoch – Google zeigt dir, wann und wo es zum ersten Mal auftauchte.' }
                    ]},
                    { title: "2. Quellen legal nutzen und zitieren", intro: "Wer Quellen findet, muss wissen, was er damit tun darf – und was nicht. Das Urheberrecht schützt die Arbeit anderer Menschen.", blocks: [
                        { type: 'warning', title: 'Das Internet ist kein Selbstbedienungsladen', text: 'Bilder, Texte, Videos und Musik aus dem Internet gehören rechtlich dem, der sie erstellt hat (dem Urheber). Ein Bild aus der Google-Bildersuche einfach in eine Präsentation zu kopieren ist eine Urheberrechtsverletzung – auch in der Schule.' },
                        { type: 'info', title: 'Zitieren ist Pflicht', text: 'Du darfst kurze Abschnitte aus fremden Texten nutzen, aber du musst sie zwingend in **„Anführungszeichen"** setzen und direkt danach angeben, von wem der Text stammt und wo du ihn gefunden hast. Das gilt für Wikipedia genauso wie für gedruckte Bücher.' },
                        { type: 'success', title: 'Freie Quellen nutzen', text: 'Viele Inhalte sind explizit zur freien Nutzung freigegeben. Für Bilder: **Pixabay.com**, **Unsplash.com** oder **Pexels.com**. Für Texte und historische Dokumente: **Wikimedia Commons** oder das **Deutsche Digitale Archiv**. Für Musik: **ccmixter.org** oder die **YouTube Audio Library**.' },
                        { type: 'tip', title: 'Creative Commons (CC)', text: 'Viele Urheber stellen ihre Werke unter Creative-Commons-Lizenzen. Die häufigste lautet **CC BY** – du darfst das Werk frei nutzen, musst aber den Namen des Urhebers nennen. Achte beim Download immer auf das Lizenzkürzel.' }
                    ]},
                    { title: "3. Sauber dokumentieren", intro: "Eine korrekte Quellenangabe ist keine Formalie – sie zeigt, dass du sorgfältig und ehrlich gearbeitet hast.", blocks: [
                        { type: 'standard', title: 'So sieht eine vollständige Quellenangabe aus', text: 'Eine Quellenangabe enthält immer: **Autor oder Urheber** (falls bekannt) – **Titel des Werkes** – **Erscheinungsjahr** – **URL** (bei Online-Quellen) – **Datum des Abrufs**. Beispiel: *Bundeszentrale für politische Bildung: „Was sind Fake News?", 2022, www.bpb.de, abgerufen am 12.05.2026.*' },
                        { type: 'info', title: 'Das Impressum als Qualitätsmerkmal', text: 'Seriöse Webseiten haben ein **Impressum** – eine gesetzlich vorgeschriebene Seite, die angibt, wer rechtlich für den Inhalt verantwortlich ist. Fehlt das Impressum, ist das ein starkes Warnsignal für eine unseriöse oder anonyme Quelle.' }
                    ]}

            10: {
                sections: [
                    { title: "1. Der Preis des 'Kostenlosen'", intro: "Instagram, TikTok und YouTube sind keine sozialen Dienste – sie sind Werbeunternehmen. Wer das versteht, kann bewusster damit umgehen.", blocks: [
                        { type: 'warning', title: 'Du bist das Produkt', text: 'Wenn ein digitales Angebot kostenlos ist, bezahlst du mit deinen Daten. Soziale Netzwerke sammeln ununterbrochen, wie lange du was ansiehst, was du likest und wer deine Freunde sind – um daraus ein wertvolles Werbeprofil zu erstellen.' },
                        { type: 'info', title: 'Tracker und Cookies', text: 'Unsichtbare Programme (Tracker und Cookies) verfolgen dich quer durch das gesamte Internet. Deshalb siehst du auf Instagram plötzlich Werbung für Schuhe, die du dir gestern auf einer ganz anderen Webseite angeschaut hast.' },
                        { type: 'tip', title: 'Cookie-Banner richtig nutzen', text: 'Klicke auf neuen Webseiten nicht blindlings auf **„Alle akzeptieren"**. Nimm dir die drei Sekunden, um auf „Nur essenzielle" oder „Ablehnen" zu klicken – das reduziert, wie viele Daten über dich gesammelt werden.' }

                    { title: "2. Der Algorithmus und du", intro: "Social-Media-Apps haben nur ein Ziel: deine Zeit. Dafür nutzen sie psychologische Tricks, die du kennen solltest.", blocks: [
                        { type: 'warning', title: 'Endless Scroll und Zeitverlust', text: 'Früher hatten Webseiten Seitenumbrüche. Heute gibt es in Apps kein Ende mehr – wenn du nach unten scrollst, lädt sofort neuer Inhalt nach. Das trickst unser Gehirn aus und lässt uns das Zeitgefühl verlieren.', image: '' },
                        { type: 'standard', title: 'Die Filterblase', text: 'Algorithmen zeigen dir bevorzugt Inhalte, bei denen du länger verweilst. Das klingt praktisch, hat aber einen Haken: Du bekommst immer mehr von dem, was du ohnehin schon denkst – und verlierst den Blick für andere Perspektiven. Dieses Phänomen nennt man **Filterblase** oder **Echokammer**.' },
                        { type: 'tip', title: 'Digital Wellbeing', text: 'Nimm die Kontrolle zurück! Nutze die **„Bildschirmzeit"**-Funktion deines Handys, um zu sehen, wie viel Zeit du wirklich in welcher App verbringst – und setze dir dort harte, feste App-Limits.' }

                    { title: "3. Deine Privatsphäre schützen", intro: "Du kannst nicht alles verhindern – aber du kannst es Firmen und Fremden deutlich schwerer machen.", blocks: [
                        { type: 'success', title: 'Profile auf Privat stellen', text: 'Stelle deine Social-Media-Accounts so ein, dass nur deine bestätigten Freunde deine Bilder und Videos sehen können. Ein öffentliches Profil ist wie ein offenes Tagebuch auf dem Marktplatz.' },
                        { type: 'info', title: 'App-Berechtigungen prüfen', text: 'Viele Apps verlangen Zugriff auf Standort, Mikrofon oder Kamera, obwohl sie das für ihre Kernfunktion gar nicht brauchen. Prüfe in den Einstellungen deines Smartphones regelmäßig, welche App welche Berechtigung hat – und entziehe alles, was nicht nötig ist.' },
                        { type: 'warning', title: 'Browserdaten löschen', text: 'Dein Browser speichert deinen Verlauf, Cookies und Anmeldedaten. Lösche diese Daten regelmäßig – besonders auf gemeinsam genutzten Geräten. Die Funktion findest du in den Einstellungen jedes Browsers unter **„Browserdaten löschen"**.' }

            11: {

                    { title: "1. Technische Bedienung", intro: "Die Kommunikation mit einer KI (wie ChatGPT) nennt man Prompting. Es ist wie Programmieren mit normaler Sprache.", blocks: [
                        { type: 'standard', title: 'Die Profi-Formel (Rolle + Aufgabe + Format)', text: 'Ein "Prompt" ist dein Befehl. Sag der KI extrem präzise, was sie tun soll. Beispiel: "Handle als Historiker (Rolle). Fasse den 2. Weltkrieg (Aufgabe) in 3 kurzen Stichpunkten zusammen (Format)."', image: '' },
                        { type: 'tip', title: 'Iteratives Arbeiten', text: 'Gib dich nie mit der ersten Antwort der KI zufrieden. Das ist erst der Rohentwurf! Gib der KI kritisches Feedback: "Das war zu kompliziert formuliert, schreibe es einfacher." oder "Kürze den zweiten Absatz." Mach sie zu deinem Assistenten.' }

                    { title: "2. Kriterien für Qualität", intro: "Künstliche Intelligenz ist mächtig, aber dumm. Sie weiß nicht, was die Wahrheit ist.", blocks: [
                        { type: 'warning', title: 'Halluzinationen (KIs lügen!)', text: 'KIs schlagen Fakten nicht nach, sie raten mathematisch das wahrscheinlichste nächste Wort. Wenn sie etwas nicht wissen, erfinden sie oft extrem überzeugend klingende Fakten ("Halluzinationen"). Überprüfe wichtige Fakten IMMER mit einer echten Suchmaschine!' },
                        { type: 'info', title: 'Der eigene Stil', text: 'KI-Texte klingen oft schrecklich langweilig, seelenlos oder benutzen immer exakt dieselben Phrasen ("Zusammenfassend lässt sich sagen..."). Ein Lehrer erkennt das sofort. Formuliere KI-Texte immer in deinen völlig eigenen Stil um.' },
                        { type: 'success', title: 'Transparenz ist Pflicht', text: 'Gib in der Schule bei Hausarbeiten oder Referaten immer mutig und offen an, wenn (und für welche Teilschritte) du eine KI zur Hilfe genutzt hast.' }

            12: {

                    { title: "1. Dein digitaler Fußabdruck", intro: "Jede Handlung im Netz hinterlässt Spuren – ob du willst oder nicht. Wer das weiß, handelt bewusster.", blocks: [
                        { type: 'warning', title: 'Das Internet vergisst nicht', text: 'Jeder Klick, jedes gelikte Foto und jeder Kommentar aus deiner Jugendzeit hinterlässt einen fast unlöschbaren digitalen Fußabdruck. Arbeitgeber und Universitäten googeln Bewerber heute routinemäßig vor dem ersten Gespräch. Ein peinliches öffentliches Foto von heute kann in vier Jahren deinen Traumjob kosten.', image: '' },
                        { type: 'tip', title: 'Ego-Googling', text: 'Suche regelmäßig deinen eigenen Namen in Anführungszeichen bei Google (z.B. `"Max Mustermann"`) und prüfe auch die Bildersuche. Was würde ein Fremder über dich denken, wenn er diese Ergebnisse sieht?' },
                        { type: 'success', title: 'Aufräumen und Recht am eigenen Bild', text: 'Wenn andere peinliche Fotos von dir gepostet haben, kannst du deren Löschung verlangen – du hast ein gesetzliches **Recht am eigenen Bild**. Bei Google kannst du außerdem einen offiziellen Antrag stellen, bestimmte Suchergebnisse zu entfernen.' }
                    ]},
                    { title: "2. KI-Ethik: Chancen und Risiken", intro: "Künstliche Intelligenz verändert unsere Gesellschaft grundlegend. Wer mündig damit umgehen will, muss ihre Grenzen und Gefahren kennen.", blocks: [
                        { type: 'warning', title: 'Bias – Vorurteile in Algorithmen', text: 'KI lernt ausschließlich aus alten, von Menschen produzierten Daten. Waren diese Daten rassistisch, sexistisch oder einseitig, übernimmt die KI diese Vorurteile unbemerkt. Ein reales Beispiel: Ein Bewerbungsalgorithmus eines großen Tech-Konzerns benachteiligte systematisch Frauen – weil er aus historischen Daten gelernt hatte, dass Führungskräfte bisher fast immer männlich waren.' },
                        { type: 'warning', title: 'Deepfakes und die Wahrheit', text: 'KI kann heute täuschend echte Videos und Stimmen von Personen erzeugen (Deepfakes). Man kann Menschen Dinge in den Mund legen, die sie nie gesagt haben. Das stellt unser Vertrauen in digitale Medien fundamental in Frage – und ist eine ernste Bedrohung für demokratische Prozesse.', image: '' },
                        { type: 'info', title: 'Wem gehört KI-Kunst?', text: 'KI-Systeme werden mit Millionen fremder Bilder, Texte und Musikstücke trainiert – oft ohne Zustimmung der Urheber. Wenn eine KI dann ein neues Bild erzeugt, ist unklar: Wem gehört es? Dem Nutzer, dem Unternehmen oder den Künstlern, deren Werke als Training dienten? Diese Fragen sind rechtlich noch nicht abschließend geklärt.' }
                    ]},
                    { title: "3. Mündig handeln", intro: "Digitale Mündigkeit bedeutet nicht, Technik abzulehnen – sondern sie bewusst, kritisch und verantwortungsvoll zu nutzen.", blocks: [

                        { type: 'tip', title: 'Transparenz und Verantwortung', text: 'Gib in der Schule offen an, wenn und wie du KI genutzt hast. Digitale Mündigkeit bedeutet auch, die eigene Verantwortung nicht an Algorithmen abzugeben – weder beim Schreiben, beim Urteilen noch beim Handeln.' }
                    ]}

        const QuizModal = ({ module, onClose, onPass }) => {
            const allQ = QUIZ_DATA[module.id] || [];

            const shuffle = (arr) => {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            };

            const buildQuestions = () => shuffle(allQ).map(q => {
                const indexed = q.a.map((text, i) => ({ text, correct: q.c.includes(i) }));
                const shuffled = shuffle(indexed);
                return {
                    q: q.q,
                    answers: shuffled.map(x => x.text),
                    correct: shuffled.reduce((acc, x, i) => { if (x.correct) acc.push(i); return acc; }, []),
                    isMulti: q.c.length > 1
                };
            });

            const [questions, setQuestions] = useState(() => buildQuestions());
            const [current, setCurrent] = useState(0);
            const [selected, setSelected] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [result, setResult] = useState(null);
            const [saving, setSaving] = useState(false);

            const q = questions[current];
            const curSel = selected[current] || new Set();
            const isLast = current === questions.length - 1;
            const allAnswered = questions.every((_, i) => (selected[i] || new Set()).size > 0);

            const toggle = (idx) => {
                if (submitted) return;
                setSelected(prev => {
                    const s = new Set(prev[current] || []);
                    if (q.isMulti) { s.has(idx) ? s.delete(idx) : s.add(idx); }
                    else { s.clear(); s.add(idx); }
                    return { ...prev, [current]: new Set(s) };
                });

            const handleSubmit = async () => {
                let correct = 0;
                questions.forEach((question, qi) => {
                    const sel = selected[qi] || new Set();
                    const correctSet = new Set(question.correct);
                    if (sel.size === correctSet.size && [...sel].every(x => correctSet.has(x))) correct++;
                });
                const pct = Math.round((correct / questions.length) * 100);
                setResult({ correct, pct, passed: pct >= 80 });
                setSubmitted(true);
                if (pct >= 80) {
                    setSaving(true);
                    await onPass(module.id);
                    setSaving(false);
                }
            };

                setQuestions(buildQuestions());
                setCurrent(0);
                setSelected({});
                setSubmitted(false);

        // --- HAUPT-APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [studentData, setStudentData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authRequired, setAuthRequired] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");
            const [activeStage, setActiveStage] = useState("5-6");
            const [selectedModule, setSelectedModule] = useState(null);
            const [activeQuiz, setActiveQuiz] = useState(null);

            useEffect(() => {
                const bootstrap = async () => {
                    try {
                        await msalInitPromise;
                        await msalInstance.handleRedirectPromise();
                        
                        let activeAccount = msalInstance.getActiveAccount();
                        if (!activeAccount && msalInstance.getAllAccounts().length > 0) {
                            activeAccount = msalInstance.getAllAccounts()[0];
                            msalInstance.setActiveAccount(activeAccount);
                        }

                        if (activeAccount) {
                            setUser({ name: activeAccount.name, username: activeAccount.username });
                            fetchMyData(activeAccount);
                        } else {
                            setAuthRequired(true);
                            setLoading(false);
                        }
                    } catch (err) {
                        console.error(err);
                        setAuthRequired(true);
                        setLoading(false);
                    }
                };
                bootstrap();
            }, []);

            const handleLogin = () => {
                setLoading(true);
                msalInstance.loginRedirect({ scopes: ["Sites.ReadWrite.All"] });
            };

            const handleLogout = () => {
                msalInstance.logoutRedirect({ postLogoutRedirectUri: window.location.origin });
            };

            const fetchMyData = async (account) => {
                try {
                    const tokenRes = await msalInstance.acquireTokenSilent({ scopes: ["Sites.ReadWrite.All"], account });
                    const url = `https://graph.microsoft.com/v1.0/sites/${MS_CONFIG.siteId}/lists/${MS_CONFIG.listId}/items?$expand=fields&$top=999`;

                    const res = await fetch(url, {
                        headers: {
                            Authorization: `Bearer ${tokenRes.accessToken}`,
                            Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly"
                        }
                    });

                    if (!res.ok) throw new Error("Fehler beim Abrufen der SharePoint-Daten.");
                    const data = await res.json();

                    const myRecord = data.value.find(item =>
                        item.fields.Title && item.fields.Title.toLowerCase() === account.username.toLowerCase()
                    );

                    if (myRecord) {
                        const f = myRecord.fields;
                        const completedArray = f.Erledigte_Module ? f.Erledigte_Module.split(',').map(m => parseInt(m.trim())).filter(n => !isNaN(n)) : [];
                        const quizUnlockedArray = f.Quiz_Freigaben ? f.Quiz_Freigaben.split(',').map(m => parseInt(m.trim())).filter(n => !isNaN(n)) : [];

                        let parsedDates = {};
                        if (f.Modul_Daten) {
                            try { parsedDates = JSON.parse(f.Modul_Daten); } catch(e) {}
                        }

                        setStudentData({
                            itemId: myRecord.id,
                            vorname: f.Vorname || "",
                            nachname: f.Nachname || "",
                            klasse: f.Klasse || "",
                            completedTasks: completedArray,
                            moduleDates: parsedDates,
                            quizUnlocked: quizUnlockedArray
                        });
                    } else {
                        setErrorMsg("Deine E-Mail-Adresse wurde noch nicht in die Datenbank eingetragen. Bitte melde dich bei deiner Lehrkraft.");
                    }
                } catch (error) {
                    if (error.name === "InteractionRequiredAuthError") {
                        msalInstance.loginRedirect({ scopes: ["Sites.ReadWrite.All"] });
                    } else {
                        setErrorMsg("Fehler beim Laden deiner Daten.");
                    }
                } finally {
                    setLoading(false);
                }
            };

            const markModuleComplete = async (moduleId) => {
                // Optimistisches Update: UI sofort aktualisieren
                const newTasks = [...(studentData.completedTasks || []), moduleId];
                const newDates = { ...(studentData.moduleDates || {}), [moduleId]: { datum: new Date().toLocaleDateString('de-DE'), lehrer: "Quiz ✓" } };
                setStudentData(prev => ({ ...prev, completedTasks: newTasks, moduleDates: newDates }));

                // Dann SharePoint im Hintergrund aktualisieren
                try {
                    const account = msalInstance.getActiveAccount();
                    const tokenRes = await msalInstance.acquireTokenSilent({ scopes: ["Sites.ReadWrite.All"], account });
                    const url = `https://graph.microsoft.com/v1.0/sites/${MS_CONFIG.siteId}/lists/${MS_CONFIG.listId}/items/${studentData.itemId}/fields`;
                    const res = await fetch(url, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${tokenRes.accessToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "Erledigte_Module": newTasks.join(', '), "Modul_Daten": JSON.stringify(newDates) })
                    });
                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        console.error("SharePoint-Fehler:", errData.error?.message || res.statusText);
                    }
                } catch(e) {
                    console.error("Fehler beim Speichern des Modulabschlusses:", e);
                }

            if (authRequired) {

                                className="w-full text-white font-black uppercase tracking-widest px-6 py-4 rounded-2xl transition-all shadow-lg active:scale-95" 
                                style={{ backgroundColor: THOMA_RED }}>
                                Anmelden
                            </button>
                        </div>
                    </div>

            if (errorMsg) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6">

                            <div className="mx-auto w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-4 text-red-500">
                                <Icon name="user-x" size={32} />
                            </div>
                            <h2 className="text-xl font-black mb-2 text-slate-800">Kein Profil gefunden</h2>
                            <p className="text-slate-500 mb-6 text-sm">{errorMsg}</p>
                            <button onClick={handleLogout} className="bg-slate-100 text-slate-600 font-bold uppercase px-6 py-3 rounded-xl w-full">Abmelden</button>
                        </div>
                    </div>
                );
            }

            const totalCompleted = studentData ? studentData.completedTasks.length : 0;
            const progressPercent = Math.round((totalCompleted / ALL_MODULES.length) * 100) || 0;

            const renderModuleCard = (modul) => {
                const isDone = studentData?.completedTasks.includes(modul.id);
                const isQuizUnlocked = studentData?.quizUnlocked?.includes(modul.id);
                const moduleData = studentData?.moduleDates?.[modul.id];
                let dateDone = "—", teacherName = "";
                if (moduleData) {
                    if (typeof moduleData === 'string') { dateDone = moduleData; }
                    else { dateDone = moduleData.datum || "—"; teacherName = moduleData.lehrer || ""; }
                }

                // Zustand 3: Erledigt
                if (isDone) {
                    return (
                        <div key={modul.id} onClick={() => setSelectedModule(modul)}
                            className="bg-white rounded-2xl p-6 border-2 border-green-400 shadow-green-100 shadow-lg cursor-pointer hover:-translate-y-1 hover:shadow-xl transition-all flex flex-col h-full">
                            <div className="flex justify-between items-start mb-5">
                                <span className="text-[10px] font-black uppercase tracking-widest bg-green-50 text-green-600 px-3 py-1 rounded-lg">Klasse {modul.stage}</span>
                                <div className="w-9 h-9 bg-green-500 rounded-full flex items-center justify-center text-white shadow-md shrink-0 ml-2"><Icon name="check" size={18} /></div>
                            </div>
                            <div className="flex items-start gap-4 mb-3">
                                <div className="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center shrink-0">
                                    <Icon name={modul.icon} size={26} className="text-[#BF0D3E]" />
                                </div>
                                <h3 className="font-black text-lg tracking-tight leading-tight text-slate-800">{modul.title}</h3>
                            </div>
                            <p className="text-sm leading-relaxed font-medium mb-4 text-slate-500">{modul.description}</p>
                            <div className="mt-auto">
                                <div className="text-[10px] font-bold text-green-600 flex flex-col gap-0.5 mb-4">
                                    <span className="flex items-center gap-1"><Icon name="calendar-check" size={12} /> Zertifiziert am {dateDone}</span>
                                    {teacherName && <span className="text-[9px] text-green-700 ml-4">durch {teacherName}</span>}
                                </div>
                                <div className="pt-3 border-t border-slate-100 text-center">
                                    <span className="text-[9px] sm:text-[10px] font-black uppercase tracking-widest text-[#BF0D3E] flex items-center justify-center gap-2">
                                        <Icon name="book-open" size={14} /> Wissensspeicher öffnen
                                    </span>
                                </div>
                            </div>
                        </div>
                    );
                }

                // Zustand 2: Quiz freigeschaltet
                if (isQuizUnlocked) {
                    return (
                        <div key={modul.id} className="bg-white rounded-2xl p-6 border-2 border-blue-300 shadow-blue-100 shadow-lg flex flex-col h-full">
                            <div className="flex justify-between items-start mb-5">
                                <span className="text-[10px] font-black uppercase tracking-widest bg-blue-50 text-blue-600 px-3 py-1 rounded-lg">Quiz verfügbar</span>
                                <div className="w-9 h-9 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 shrink-0 ml-2"><Icon name="pencil" size={16} /></div>
                            </div>
                            <div className="flex items-start gap-4 mb-3">
                                <div className="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center shrink-0">
                                    <Icon name={modul.icon} size={26} className="text-blue-500" />
                                </div>
                                <h3 className="font-black text-lg tracking-tight leading-tight text-slate-800">{modul.title}</h3>
                            </div>
                            <p className="text-sm leading-relaxed font-medium mb-4 text-slate-500">{modul.description}</p>
                            <div className="mt-auto">
                                <p className="text-[10px] font-bold text-blue-500 mb-3 flex items-center gap-1">
                                    <Icon name="info" size={12} /> 15 Fragen • mind. 80% zum Bestehen
                                </p>
                                <button onClick={() => setActiveQuiz(modul)}
                                    className="w-full text-white font-black uppercase tracking-widest px-4 py-3 rounded-2xl transition-all shadow-md hover:scale-105 active:scale-95 flex items-center justify-center gap-2 bg-blue-500 hover:bg-blue-600">
                                    <Icon name="play" size={18} /> Quiz starten
                                </button>
                            </div>
                        </div>
                    );
                }

                // Zustand 1: Gesperrt
                return (
                    <div key={modul.id} className="bg-white rounded-2xl p-6 border-2 border-slate-100 shadow-sm flex flex-col h-full opacity-75">
                        <div className="flex justify-between items-start mb-5">
                            <span className="text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-400 px-3 py-1 rounded-lg">Klasse {modul.stage}</span>
                            <div className="w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 shrink-0 ml-2"><Icon name="lock" size={16} /></div>
                        </div>
                        <div className="flex items-start gap-4 mb-3">
                            <div className="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center shrink-0">
                                <Icon name={modul.icon} size={26} className="text-slate-300" />
                            </div>
                            <h3 className="font-black text-lg tracking-tight leading-tight text-slate-400">{modul.title}</h3>
                        </div>
                        <p className="text-sm leading-relaxed font-medium mb-4 text-slate-300">{modul.description}</p>
                        <div className="mt-auto">
                            <p className="text-xs font-medium text-slate-300 flex items-center gap-1"><Icon name="lock" size={12} /> Lehrkraft schaltet Quiz frei</p>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 font-sans pb-10 relative">

                    {/* QUIZ MODAL */}
                    {activeQuiz && (
                        <QuizModal
                            module={activeQuiz}
                            onClose={() => setActiveQuiz(null)}
                            onPass={markModuleComplete}
                        />
                    )}

                    {/* OVERLAY / MODAL: Wissensspeicher */}
                    {selectedModule && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-[3rem] w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden relative animate-in fade-in zoom-in-95 duration-200">
                                {/* Modal Header */}
                                <div className="bg-[#BF0D3E] text-white p-8 sm:p-10 flex justify-between items-center shrink-0">
                                    <div>
                                        <span className="text-red-200 text-xs font-black uppercase tracking-widest mb-2 block">
                                            {selectedModule.category === 'skills' ? 'Skills (Anwendung)' : 'Umgang (Reflexion)'} • Klasse {selectedModule.stage}
                                        </span>
                                        <h2 className="text-3xl sm:text-4xl font-black tracking-tight">{selectedModule.title}</h2>
                                    </div>
                                    <button onClick={() => setSelectedModule(null)} className="flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white px-5 py-3 rounded-2xl transition-all shadow-sm active:scale-95 border border-white/30" title="Schließen">
                                        <Icon name="x" size={24} />
                                        <span className="font-bold uppercase tracking-wider text-sm hidden sm:inline">Schließen</span>
                                    </button>
                                </div>

                                {/* Modal Body (Scrollable) */}
                                <div className="p-8 sm:p-12 overflow-y-auto bg-white custom-scroll">
                                    <RenderWissensspeicher module={selectedModule} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-[#BF0D3E] text-white pt-12 pb-6 px-6 sm:px-8 shadow-md rounded-b-[2rem] sm:rounded-b-[3rem] relative z-10">
                        <div className="max-w-5xl mx-auto flex justify-between items-start">
                            <div className="mr-4">
                                <h1 className="text-3xl sm:text-4xl font-black uppercase tracking-tighter mb-1">Hallo {studentData?.vorname}!</h1>
                                <p className="text-red-200 font-bold text-sm sm:text-base opacity-90">Klasse {studentData?.klasse} • Gymnasium Thomaeum</p>
                            </div>
                            <button onClick={handleLogout} className="flex items-center gap-2 bg-white text-[#BF0D3E] hover:bg-slate-100 px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl sm:rounded-2xl transition-all shadow-lg active:scale-95 shrink-0 mt-1 sm:mt-0" title="Abmelden">
                                <Icon name="log-out" size={16} className="sm:w-[18px] sm:h-[18px]" />
                                <span className="font-black uppercase tracking-wider text-[10px] sm:text-xs">Abmelden</span>
                            </button>
                        </div>
                        
                        {/* Fortschrittsbalken */}
                        <div className="max-w-5xl mx-auto mt-8 bg-black/10 p-5 rounded-3xl backdrop-blur-sm">
                            <div className="flex justify-between items-end mb-3">
                                <span className="font-black uppercase tracking-widest text-xs sm:text-sm text-white">Dein Fortschritt</span>
                                <span className="font-black text-2xl sm:text-3xl text-white">{progressPercent}%</span>
                            </div>
                            <div className="h-4 bg-black/20 rounded-full overflow-hidden shadow-inner relative">
                                <div className="h-full bg-white rounded-full transition-all duration-1000 ease-out" style={{ width: `${progressPercent}%` }}></div>
                                <div className="absolute top-0 bottom-0 left-[33.33%] w-1 bg-black/20"></div>
                                <div className="absolute top-0 bottom-0 left-[66.66%] w-1 bg-black/20"></div>
                            </div>
                            <p className="text-right mt-2 text-[10px] font-bold text-red-200 uppercase">{totalCompleted} von {ALL_MODULES.length} Modulen geschafft</p>
                        </div>
                    </header>

                    {/* Content / Module */}
                    <main className="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-8 mt-[-1rem] sm:mt-[-2rem] relative z-20">
                        
                        {/* Navigation für die Jahrgangsstufen */}
                        <div className="flex gap-3 mb-2 overflow-x-auto pb-4 scrollbar-hide pt-4 sm:pt-6">
                            {["5-6", "7-8", "9-10"].map(stage => (
                                <button 
                                    key={stage} 
                                    onClick={() => setActiveStage(stage)} 
                                    className={`px-6 py-3 rounded-2xl font-black transition-all whitespace-nowrap shadow-sm ${activeStage === stage ? 'text-white shadow-md scale-105' : 'bg-white text-slate-400 border border-slate-100 hover:bg-slate-50'}`} 
                                    style={activeStage === stage ? { backgroundColor: THOMA_RED } : {}}
                                >
                                    Klasse {stage}
                                </button>
                            ))}
                        </div>

                        <div className="mb-10">
                            <h3 className="text-xl font-black text-slate-800 mb-4 flex items-center gap-2">
                                <Icon name="wrench" size={24} className="text-[#BF0D3E]" /> Skills (Anwendung)
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                {ALL_MODULES.filter(m => m.stage === activeStage && m.category === 'skills').map(modul => renderModuleCard(modul))}
                            </div>
                        </div>

                        <div className="mb-4">
                            <h3 className="text-xl font-black text-slate-800 mb-4 flex items-center gap-2">
                                <Icon name="brain" size={24} className="text-[#BF0D3E]" /> Reflexion (Umgang)
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                {ALL_MODULES.filter(m => m.stage === activeStage && m.category === 'reflexion').map(modul => renderModuleCard(modul))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
