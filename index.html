<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Medienpass | Gymnasium Thomaeum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.32.2/js/msal-browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --thomaeum-red: #BF0D3E; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: var(--thomaeum-red); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const MS_CONFIG = {
            tenantId: "09c4bd58-1b8c-410d-930e-816015e61028",
            clientId: "7d277b19-93c1-4df7-8f1b-d38749b3d440",
            siteId: "thomaeumde.sharepoint.com,9ef17c4d-b57b-482e-9168-3cc3bc43bc3d,d600d53b-cfd0-45f7-96a5-f1ac20222f8f",
            listId: "08da02d9-5b67-4938-9d7e-9e9dee97fa2e"
        };
        const THOMA_RED = "#BF0D3E";

        const msalConfig = {
            auth: {
                clientId: MS_CONFIG.clientId,
                authority: `https://login.microsoftonline.com/${MS_CONFIG.tenantId}`,
                redirectUri: window.location.origin,
                navigateToLoginRequestUrl: true
            },
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
        };
        
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const msalInitPromise = msalInstance.initialize();

        const ALL_MODULES = [
            { id: 1, title: "Hardware-Führerschein", stage: "5-6", category: "skills", icon: "monitor" }, 
            { id: 2, title: "Dateimanagement", stage: "5-6", category: "skills", icon: "folder" }, 
            { id: 3, title: "Umgang mit Word", stage: "5-6", category: "skills", icon: "file-text" },
            { id: 7, title: "Präsentationsprofi", stage: "5-6", category: "skills", icon: "presentation" },
            { id: 4, title: "Netiquette", stage: "5-6", category: "reflexion", icon: "message-square" }, 
            { id: 5, title: "Prävention", stage: "5-6", category: "reflexion", icon: "shield-alert" }, 
            { id: 6, title: "Suchmaschinen", stage: "5-6", category: "reflexion", icon: "search" },
            { id: 19, title: "Sichere Passwörter", stage: "5-6", category: "reflexion", icon: "key" },
            { id: 8, title: "Medienproduktion", stage: "7-8", category: "skills", icon: "video" }, 
            { id: 9, title: "Tabellenkalkulation", stage: "7-8", category: "skills", icon: "table" },
            { id: 20, title: "Bildbearbeitung", stage: "7-8", category: "skills", icon: "image" },
            { id: 21, title: "Audio & Podcasts", stage: "7-8", category: "skills", icon: "mic" },
            { id: 10, title: "Urheberrecht", stage: "7-8", category: "reflexion", icon: "copyright" }, 
            { id: 11, title: "Quellenkritik", stage: "7-8", category: "reflexion", icon: "check-circle" }, 
            { id: 12, title: "Datenschutz", stage: "7-8", category: "reflexion", icon: "lock" },
            { id: 22, title: "Social Media Check", stage: "7-8", category: "reflexion", icon: "smartphone" },
            { id: 13, title: "KI-Produktivität", stage: "9-10", category: "skills", icon: "cpu" }, 
            { id: 14, title: "Digitale Bewerbung", stage: "9-10", category: "skills", icon: "briefcase" }, 
            { id: 15, title: "Projektmanagement", stage: "9-10", category: "skills", icon: "kanban" },
            { id: 23, title: "Webdesign Basics", stage: "9-10", category: "skills", icon: "globe" },
            { id: 16, title: "KI-Ethik", stage: "9-10", category: "reflexion", icon: "scale" }, 
            { id: 17, title: "Zivilcourage", stage: "9-10", category: "reflexion", icon: "users" }, 
            { id: 18, title: "Digitaler Fußabdruck", stage: "9-10", category: "reflexion", icon: "footprint" },
            { id: 24, title: "Datenökonomie", stage: "9-10", category: "reflexion", icon: "database" }
        ];

        const MODULE_CONTENT_DATA = {
            1: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Dein Computer macht genau das, was du ihm sagst.", blocks: [{ type: 'standard', title: 'Maus & Tastatur', text: 'Nutze den **Linksklick** zum Auswählen und den **Rechtsklick** für Optionen. Mit der **Shift-Taste** schreibst du Buchstaben groß.' }] },
                    { title: "2. Kriterien für Qualität", intro: "Sicherheit und Haltung sind das A und O.", blocks: [{ type: 'info', title: 'Ergonomie', text: 'Sitze gerade und achte darauf, dass deine Augen auf Höhe der Bildschirmoberkante sind.' }] }
                ],
                missions: ["Erstelle eine Textdatei.", "Schreibe deinen Namen groß.", "Nutze einen Rechtsklick.", "Prüfe deine Sitzhöhe.", "Sperre den PC."]
            },
            2: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Ordnung ist der halbe Erfolg.", blocks: [{ type: 'standard', title: 'Ordner & Cloud', text: 'Erstelle Ordner mit Rechtsklick > Neu. Nutze OneDrive für deine Hausaufgaben.' }] },
                    { title: "2. Kriterien für Qualität", intro: "So findest du alles wieder.", blocks: [{ type: 'success', title: 'Benennung', text: 'Nutze Namen wie `Datum_Fach_Thema.docx`.' }] }
                ],
                missions: ["Erstelle Ordner 'Schule'.", "Erstelle Fach-Unterordner.", "Benenne eine Datei um.", "Verschiebe Dateien.", "Leere den Papierkorb."]
            },
            3: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Texte professionell gestalten.", blocks: [{ type: 'standard', title: 'Formatierung', text: 'Nutze Formatvorlagen für Überschriften. Drücke `Strg+S` zum Speichern.' }] },
                    { title: "2. Kriterien für Qualität", intro: "Lesbarkeit ist entscheidend.", blocks: [{ type: 'success', title: 'PDF Export', text: 'Speichere fertige Arbeiten als PDF.' }] }
                ],
                missions: ["Schreibe einen Satz fett.", "Nutze Überschrift 1.", "Nutze Strg+Z.", "Füge ein Bild ein.", "Exportiere als PDF."]
            },
            6: {
                sections: [
                    { title: "1. Technische Bedienung", intro: "Suchen wie ein Profi.", blocks: [{ type: 'tip', title: 'Keywords', text: 'Nutze Schlagwörter statt ganzer Sätze. Nutze `""` für exakte Suchen.' }] },
                    { title: "2. Kriterien für Qualität", intro: "Quellen prüfen.", blocks: [{ type: 'warning', title: 'Werbung', text: 'Meide Treffer, die als Anzeige markiert sind.' }] }
                ],
                missions: ["Suche auf Blinde-Kuh.", "Nutze den Minus-Operator.", "Erkenne Werbe-Links.", "Finde das Gründungsjahr.", "Lies das Snippet."]
            }
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    setSvg(window.lucide.icons[name].toSvg({ width: size, height: size, class: className }));
                }
            }, [name, size, className]);
            return <span className={`inline-flex items-center justify-center ${className}`} dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        const RenderWissensspeicher = ({ module }) => {
            const data = MODULE_CONTENT_DATA[module.id];
            if (!data) return (
                <div className="text-center py-16 opacity-50">
                    <Icon name="book-open" size={48} className="mb-4" />
                    <h3 className="text-xl font-bold">Wissensspeicher folgt</h3>
                    <p className="text-sm">Inhalte werden aktuell eingepflegt.</p>
                </div>
            );

            return (
                <div className="space-y-10">
                    {data.sections.map((sec, i) => (
                        <div key={i}>
                            <h4 className="font-black text-lg text-slate-800 mb-4 flex items-center gap-2">
                                <span className="w-8 h-8 rounded-lg bg-[#BF0D3E] text-white flex items-center justify-center text-xs">{i+1}</span>
                                {sec.title}
                            </h4>
                            <p className="text-sm text-slate-500 mb-4">{sec.intro}</p>
                            <div className="space-y-3">
                                {sec.blocks.map((block, bi) => (
                                    <div key={bi} className="p-4 rounded-2xl border-2 border-slate-100 flex gap-3 shadow-sm bg-slate-50">
                                        <Icon name={block.type === 'warning' ? 'alert-triangle' : 'info'} size={18} className="shrink-0 mt-0.5 text-[#BF0D3E]" />
                                        <div>
                                            <p className="font-bold text-sm mb-1">{block.title}</p>
                                            <p className="text-xs opacity-80" dangerouslySetInnerHTML={{ __html: block.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') }} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                    <div className="bg-amber-50 p-6 rounded-[2rem] border-2 border-amber-100">
                        <h4 className="font-black uppercase tracking-widest text-xs text-amber-600 mb-4 flex items-center gap-2">
                            <Icon name="rocket" size={16}/> Deine Missionen
                        </h4>
                        <ul className="space-y-3">
                            {data.missions.map((m, mi) => (
                                <li key={mi} className="text-xs flex gap-3 text-amber-900 font-medium">
                                    <span className="text-amber-400 font-black">•</span> {m}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [studentData, setStudentData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeStage, setActiveStage] = useState("5-6");
            const [selectedModule, setSelectedModule] = useState(null);

            useEffect(() => {
                const bootstrap = async () => {
                    try {
                        await msalInitPromise;
                        await msalInstance.handleRedirectPromise();
                        let account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
                        if (account) {
                            setUser(account);
                            fetchData(account);
                        } else {
                            setLoading(false);
                        }
                    } catch (e) { setLoading(false); }
                };
                bootstrap();
            }, []);

            const fetchData = async (account) => {
                try {
                    const tokenRes = await msalInstance.acquireTokenSilent({ scopes: ["Sites.Read.All"], account });
                    const url = `https://graph.microsoft.com/v1.0/sites/${MS_CONFIG.siteId}/lists/${MS_CONFIG.listId}/items?$expand=fields&$top=999`;
                    const res = await fetch(url, { headers: { Authorization: `Bearer ${tokenRes.accessToken}`, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" }});
                    const data = await res.json();
                    const record = data.value.find(item => item.fields.Title.toLowerCase() === account.username.toLowerCase());
                    if (record) {
                        setStudentData({
                            vorname: record.fields.Vorname,
                            nachname: record.fields.Nachname,
                            klasse: record.fields.Klasse,
                            completed: record.fields.Erledigte_Module ? record.fields.Erledigte_Module.split(',').map(m => parseInt(m.trim())) : [],
                            moduleDates: record.fields.Modul_Daten ? JSON.parse(record.fields.Modul_Daten) : {}
                        });
                    }
                } catch (e) {} finally { setLoading(false); }
            };

            const handleLogin = () => {
                setLoading(true);
                msalInstance.loginRedirect({ scopes: ["Sites.Read.All"] });
            };

            const handleLogout = () => {
                msalInstance.logoutRedirect({ postLogoutRedirectUri: window.location.origin });
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="spinner"></div></div>;

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full text-center border">
                        <Icon name="graduation-cap" size={48} className="text-[#BF0D3E] mx-auto mb-6" />
                        <h2 className="text-3xl font-black mb-2 uppercase tracking-tighter">Medienpass</h2>
                        <p className="text-slate-500 mb-8 font-medium">Gymnasium Thomaeum</p>
                        <button onClick={handleLogin} className="w-full bg-[#BF0D3E] text-white font-black py-4 rounded-2xl shadow-lg hover:scale-105 transition-all uppercase tracking-widest text-sm">Anmelden</button>
                    </div>
                </div>
            );

            const progress = Math.round(((studentData?.completed?.length || 0) / 24) * 100);

            return (
                <div className="min-h-screen pb-20 relative">
                    {selectedModule && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="bg-[#BF0D3E] text-white p-6 sm:p-8 flex justify-between items-center shrink-0">
                                    <h2 className="text-xl sm:text-2xl font-black tracking-tight uppercase">{selectedModule.title}</h2>
                                    <button onClick={() => setSelectedModule(null)} className="bg-white/20 p-2 rounded-xl hover:bg-white/30 transition-all"><Icon name="x" size={24} /></button>
                                </div>
                                <div className="p-6 sm:p-10 overflow-y-auto custom-scroll">
                                    <RenderWissensspeicher module={selectedModule} />
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-[#BF0D3E] text-white pt-12 pb-24 px-8 rounded-b-[3rem] shadow-lg">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="text-center md:text-left">
                                <h1 className="text-3xl sm:text-4xl font-black uppercase tracking-tighter">Hallo {studentData?.vorname}!</h1>
                                <p className="text-red-200 font-bold opacity-80">Klasse {studentData?.klasse} • Gymnasium Thomaeum</p>
                            </div>
                            <div className="bg-white/10 p-5 rounded-[2.5rem] backdrop-blur-md border border-white/20 text-center min-w-[280px] shadow-inner">
                                <p className="text-[10px] font-black uppercase tracking-widest mb-1 opacity-70">Gesamtfortschritt</p>
                                <p className="text-5xl font-black">{progress}%</p>
                                <div className="h-3 w-full bg-white/20 rounded-full mt-4 overflow-hidden relative">
                                    <div className="bg-white h-full transition-all duration-1000 ease-out" style={{width: `${progress}%`}}></div>
                                    <div className="absolute top-0 bottom-0 left-[33%] w-px bg-white/20"></div>
                                    <div className="absolute top-0 bottom-0 left-[66%] w-px bg-white/20"></div>
                                </div>
                                <p className="text-[9px] font-bold uppercase mt-2 opacity-50 tracking-tight">{studentData?.completed?.length || 0} von 24 Modulen zertifiziert</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="absolute top-6 right-6 p-3 bg-white/10 rounded-2xl hover:bg-white/20 transition-all border border-white/10"><Icon name="log-out" size={20}/></button>
                    </header>

                    <main className="max-w-5xl mx-auto px-6 -mt-12 relative z-20">
                        <div className="flex gap-2 mb-10 overflow-x-auto pb-4 scrollbar-hide">
                            {["5-6", "7-8", "9-10"].map(s => (
                                <button 
                                    key={s} 
                                    onClick={() => setActiveStage(s)} 
                                    className={`px-10 py-5 rounded-[2rem] font-black transition-all shadow-md flex-shrink-0 border-2 ${activeStage === s ? 'bg-white text-[#BF0D3E] border-white scale-105 shadow-xl' : 'bg-[#BF0D3E] text-white border-white/30 hover:bg-red-700'}`}
                                >
                                    KLASSE {s}
                                </button>
                            ))}
                        </div>

                        {["skills", "reflexion"].map(cat => (
                            <div key={cat} className="mb-12">
                                <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
                                    <Icon name={cat === 'skills' ? 'wrench' : 'brain'} size={16} />
                                    {cat === 'skills' ? 'Anwendung (Skills)' : 'Umgang (Reflexion)'}
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {ALL_MODULES.filter(m => m.stage === activeStage && m.category === cat).map(m => {
                                        const done = studentData?.completed?.includes(m.id);
                                        const moduleData = studentData?.moduleDates?.[m.id];
                                        let dateDone = null;
                                        let teacherName = null;
                                        if (moduleData) {
                                            if (typeof moduleData === 'string') { dateDone = moduleData; }
                                            else { dateDone = moduleData.datum; teacherName = moduleData.lehrer; }
                                        }

                                        return (
                                            <div key={m.id} onClick={() => done && setSelectedModule(m)} className={`p-6 rounded-[2.5rem] border-2 transition-all flex flex-col h-full relative ${done ? 'bg-white border-green-500 shadow-xl shadow-green-100 cursor-pointer hover:-translate-y-1' : 'bg-white/50 border-slate-100 opacity-60'}`}>
                                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mb-4 ${done ? 'bg-green-50 text-green-600' : 'bg-slate-100 text-slate-300'}`}>
                                                    <Icon name={m.icon} size={28} />
                                                </div>
                                                <h4 className={`font-black text-xs sm:text-sm leading-tight uppercase ${done ? 'text-slate-800' : 'text-slate-400'}`}>{m.title}</h4>
                                                {done ? (
                                                    <div className="mt-auto pt-4 border-t border-slate-50">
                                                        <div className="text-[9px] font-black text-green-600 uppercase flex items-center gap-1 mb-1"><Icon name="check-circle" size={12} /> Zertifiziert</div>
                                                        <div className="text-[8px] text-slate-400 font-bold leading-tight">am {dateDone}<br/>durch {teacherName || 'Lehrkraft'}</div>
                                                    </div>
                                                ) : (
                                                    <div className="mt-auto pt-4 text-[9px] font-black text-slate-300 uppercase tracking-widest">Offen</div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
